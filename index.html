<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>RoadPulse - Public Live Road Anomaly Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    html, body, #map { height: 100%; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; }

    /* Floating Top Dashboard */
    .dashboard-panel {
      position: absolute; top: 12px; left: 12px; right: 12px;
      max-width: 420px; margin: 0 auto;
      background: rgba(15, 23, 42, 0.94);
      color: #f8fafc; padding: 14px; border-radius: 14px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.45);
      z-index: 1000; border: 1px solid #334155;
      backdrop-filter: blur(10px);
      transition: all 0.35s ease;
    }

    .dashboard-panel.collapsed {
      padding: 8px 14px;
      width: fit-content;
      cursor: pointer;
      opacity: 0.9;
      background: rgba(15, 23, 42, 0.85);
    }
    .dashboard-panel.collapsed .hide-on-collapse {
      display: none !important;
    }

    .panel-header { display: flex; justify-content: space-between; align-items: center; }
    .title { font-weight: 800; font-size: 14px; letter-spacing: 0.5px; }
    .badge { font-size: 11px; padding: 4px 10px; border-radius: 20px; font-weight: bold; background: #64748b; color: #fff; }
    .badge.active { background: #22c55e; color: #000; }
    .badge.logging { background: #ef4444; color: #fff; animation: pulse 1s infinite alternate; }

    @keyframes pulse { from { opacity: 0.6; } to { opacity: 1; } }

    #toggle-btn {
      width: 100%; padding: 12px; font-size: 14px; border-radius: 8px; border: none;
      background: #22c55e; color: #000; font-weight: bold; cursor: pointer;
      margin-top: 10px; transition: background 0.2s ease;
    }
    #toggle-btn.stop {
      background: #ef4444; color: #fff;
    }

    .coords-row {
      display: flex; justify-content: space-around; margin-top: 10px;
      font-size: 11px; color: #94a3b8; font-family: monospace;
    }
    .coords-row b { color: #38bdf8; }

    .legend-bar {
      margin-top: 10px; padding-top: 8px; border-top: 1px solid #334155;
      display: flex; justify-content: space-between; font-size: 11px; color: #cbd5e1;
    }
    .dot { height: 8px; width: 8px; border-radius: 50%; display: inline-block; margin-right: 4px; }
    .dot.red { background: #ef4444; }
    .dot.orange { background: #f97316; }
    .dot.yellow { background: #eab308; }

    #log-preview {
      margin-top: 8px; font-size: 11px; color: #38bdf8; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis; font-family: monospace;
    }
  </style>
</head>
<body>

  <!-- Audio Element for Chrome Background Persistence -->
  <audio id="bg-audio" loop playsinline style="display:none;">
    <source src="https://raw.githubusercontent.com/anars/blank-audio/master/10-minutes-of-silence.mp3" type="audio/mp3">
  </audio>

  <div id="dashboard" class="dashboard-panel" onclick="expandPanel()">
    <div class="panel-header">
      <div class="title">🛣️ ROADPULSE PUBLIC MAP</div>
      <span id="status-badge" class="badge">LIVE VIEW</span>
    </div>

    <button id="toggle-btn" class="hide-on-collapse" onclick="event.stopPropagation(); toggleTracking()">
      🛰️ 1-TAP START LOGGING (DRIVER ONLY)
    </button>

    <div class="coords-row hide-on-collapse">
      <span>LAT: <b id="lat-val">--.----</b></span>
      <span>LNG: <b id="lng-val">--.----</b></span>
      <span>HAZARDS: <b id="sync-val">Loading...</b></span>
    </div>

    <div id="log-preview" class="hide-on-collapse">Public map active. Tap any circle for cluster data.</div>

    <div class="legend-bar hide-on-collapse">
      <span><span class="dot red"></span>High Impact</span>
      <span><span class="dot orange"></span>Medium</span>
      <span><span class="dot yellow"></span>Low</span>
      <span style="color:#64748b;">• Repeat hits expand size</span>
    </div>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <script>
    // Configuration Endpoints
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxovS5SKTpxjeOnrPMhGAGIfKIqji3a4TSxt7Sf7KrI-f7Aueh3tEPk6GcuOUwV9R-T/exec";
    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSvD2getclUw9lsCQXftP9oH4vFP8Yx9cEJe91JDXxq5p0Pz05WTGUFogtAbs5fpaW8Yj8gdIMOCrk4/pub?gid=0&single=true&output=csv";
    const BLYNK_AUTH_TOKEN = "k53JqlD8pCz-0Z_ixoqYMSyMgkMVN-pw";

    const BLYNK_SERVERS = [
      "https://blr1.blynk.cloud",
      "https://blynk.cloud",
      "https://ny3.blynk.cloud"
    ];

    // --- LEAFLET MAP INITIALIZATION ---
    const map = L.map('map', { zoomControl: false }).setView([18.5204, 73.8567], 13);
    L.control.zoom({ position: 'bottomright' }).addTo(map);

    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap &copy; CARTO'
    }).addTo(map);

    const layerGroup = L.layerGroup().addTo(map);
    let autoZoomed = false;

    // --- DASHBOARD INTERACTION ---
    let isTracking = false;
    let curLat = null, curLng = null;
    let lastProcessedVal = "";
    let wakeLock = null;
    let collapseTimer = null;
    let watchId = null;
    let blynkInterval = null;

    function expandPanel() {
      const panel = document.getElementById("dashboard");
      if (panel.classList.contains("collapsed")) {
        panel.classList.remove("collapsed");
        if (isTracking) resetCollapseTimer(5000);
      }
    }

    function collapsePanel() {
      if (isTracking) {
        document.getElementById("dashboard").classList.add("collapsed");
      }
    }

    function resetCollapseTimer(delay = 4000) {
      clearTimeout(collapseTimer);
      collapseTimer = setTimeout(collapsePanel, delay);
    }

    function setLoggingState(active, text) {
      const badge = document.getElementById("status-badge");
      const panel = document.getElementById("dashboard");

      if (active) {
        badge.className = "badge logging";
        badge.innerText = "RECORDING";
        panel.classList.remove("collapsed");
        document.getElementById("log-preview").innerText = text;
        clearTimeout(collapseTimer);
      } else {
        badge.className = "badge active";
        badge.innerText = "ONLINE";
        resetCollapseTimer(3000);
      }
    }

    // --- SLEEP PREVENTION ---
    async function enableSleepPrevention() {
      try {
        const audio = document.getElementById("bg-audio");
        audio.play().catch(() => {});
      } catch (e) {}

      if ('wakeLock' in navigator) {
        try {
          wakeLock = await navigator.wakeLock.request('screen');
        } catch (e) {}
      }
    }

    function disableSleepPrevention() {
      try {
        const audio = document.getElementById("bg-audio");
        audio.pause();
        audio.currentTime = 0;
      } catch (e) {}

      if (wakeLock !== null) {
        wakeLock.release().then(() => { wakeLock = null; }).catch(() => {});
      }
    }

    // --- TELEMETRY LOGGING CONTROLS ---
    function toggleTracking() {
      if (!isTracking) {
        startTracking();
      } else {
        stopTracking();
      }
    }

    function startTracking() {
      isTracking = true;

      const btn = document.getElementById("toggle-btn");
      const badge = document.getElementById("status-badge");
      btn.innerText = "⏹️ STOP LOGGING";
      btn.classList.add("stop");
      badge.className = "badge active";
      badge.innerText = "ONLINE";

      enableSleepPrevention();

      if (!navigator.geolocation) {
        alert("Geolocation not supported on this browser.");
        return;
      }

      watchId = navigator.geolocation.watchPosition(
        (pos) => {
          curLat = pos.coords.latitude;
          curLng = pos.coords.longitude;
          document.getElementById("lat-val").innerText = curLat.toFixed(4);
          document.getElementById("lng-val").innerText = curLng.toFixed(4);
        },
        (err) => {},
        { enableHighAccuracy: true, maximumAge: 1000, timeout: 10000 }
      );

      blynkInterval = setInterval(pollBlynk, 1200);
      document.getElementById("log-preview").innerText = "Logging session active.";
      resetCollapseTimer(4000);
    }

    function stopTracking() {
      isTracking = false;

      if (blynkInterval) clearInterval(blynkInterval);
      if (watchId !== null) navigator.geolocation.clearWatch(watchId);
      disableSleepPrevention();
      clearTimeout(collapseTimer);

      const btn = document.getElementById("toggle-btn");
      const badge = document.getElementById("status-badge");
      const panel = document.getElementById("dashboard");

      btn.innerText = "🛰️ 1-TAP START LOGGING (DRIVER ONLY)";
      btn.classList.remove("stop");
      badge.className = "badge";
      badge.innerText = "LIVE VIEW";
      panel.classList.remove("collapsed");

      document.getElementById("lat-val").innerText = "--.----";
      document.getElementById("lng-val").innerText = "--.----";
      document.getElementById("log-preview").innerText = "Logging stopped. Viewer mode active.";
    }

    // --- BLYNK SINGLE-PIN HARVESTER ---
    async function pollBlynk() {
      if (!isTracking) return;

      let rawVal = null;
      for (const server of BLYNK_SERVERS) {
        try {
          const res = await fetch(`${server}/external/api/get?token=${BLYNK_AUTH_TOKEN}&v1`);
          if (res.ok) {
            rawVal = await res.json();
            break;
          }
        } catch (e) {}
      }

      if (!rawVal || rawVal === "" || rawVal === lastProcessedVal) return;

      lastProcessedVal = rawVal;

      const parts = String(rawVal).split(",");
      if (parts.length < 3) return;

      const type = parts[0];
      const severity = parts[1];
      const gforce = parseFloat(parts[2]);

      setLoggingState(true, `Hazard Detected: ${type} (${gforce}g)`);

      const sendLat = (curLat !== null) ? curLat : 18.5204;
      const sendLng = (curLng !== null) ? curLng : 73.8567;

      try {
        await fetch(WEB_APP_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            type: type,
            color: severity,
            gforce: gforce,
            lat: sendLat,
            lng: sendLng
          })
        });

        setTimeout(() => {
          if (isTracking) {
            setLoggingState(false, "Telemetry recorded.");
            refreshMapData();
          }
        }, 2200);

      } catch (err) {
        if (isTracking) setLoggingState(false, "Network post error");
      }
    }

    // --- PUBLIC CLUSTER MAP ENGINE ---
    function getColorRGB(severity) {
      const s = (severity || "").toUpperCase().trim();
      if (s === "RED") return "239, 68, 68";
      if (s === "ORANGE") return "249, 115, 22";
      return "234, 179, 8";
    }

    function refreshMapData() {
      const fetchUrl = CSV_URL + '&nocache=' + new Date().getTime();

      Papa.parse(fetchUrl, {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
          const rows = results.data;
          if (!rows || rows.length === 0) {
            document.getElementById("sync-val").innerText = "0 Spots";
            return;
          }

          layerGroup.clearLayers();
          const clusters = {};
          const bounds = [];

          rows.forEach(r => {
            const lat = parseFloat(r.Latitude);
            const lng = parseFloat(r.Longitude);

            if (!isNaN(lat) && !isNaN(lng) && lat !== 0 && lng !== 0) {
              // Cluster anomalies within a ~10-15 meter spatial grid
              const clusterKey = lat.toFixed(4) + "_" + lng.toFixed(4);
              if (!clusters[clusterKey]) {
                clusters[clusterKey] = {
                  lat: lat,
                  lng: lng,
                  count: 0,
                  maxG: 0,
                  severity: r.Severity || "YELLOW",
                  type: r.Type || "POTHOLE"
                };
              }
              clusters[clusterKey].count += 1;
              const gVal = parseFloat(r.G_Force) || 0;
              if (gVal > clusters[clusterKey].maxG) {
                clusters[clusterKey].maxG = gVal;
                clusters[clusterKey].severity = r.Severity || "YELLOW";
                clusters[clusterKey].type = r.Type || "POTHOLE";
              }
            }
          });

          Object.values(clusters).forEach(item => {
            const rgb = getColorRGB(item.severity);
            const radiusMeters = 8 + (item.count - 1) * 4;
            const fillAlpha = Math.min(0.35 + (item.count * 0.08), 0.85);

            const circle = L.circle([item.lat, item.lng], {
              radius: radiusMeters,
              color: `rgba(${rgb}, 0.9)`,
              weight: 1.5,
              fillColor: `rgba(${rgb}, ${fillAlpha})`,
              fillOpacity: fillAlpha
            });

            circle.bindPopup(`
              <div style="font-size:13px; line-height:1.5; color:#0f172a;">
                <b style="font-size:14px;">${item.type}</b><br/>
                <b>Total Reports:</b> ${item.count}<br/>
                <b>Peak Impact:</b> ${item.maxG.toFixed(2)} g<br/>
                <b>Severity:</b> <span style="font-weight:bold; color:rgb(${rgb})">${item.severity}</span>
              </div>
            `);

            circle.addTo(layerGroup);
            bounds.push([item.lat, item.lng]);
          });

          // Automatically focus and fit to all logged hazards across the world
          if (!autoZoomed && bounds.length > 0) {
            map.fitBounds(bounds, { padding: [60, 60] });
            autoZoomed = true;
          }

          document.getElementById("sync-val").innerText = `${Object.keys(clusters).length} Spots`;
        }
      });
    }

    // Initial load on visit + background refresh loop
    refreshMapData();
    setInterval(refreshMapData, 5000);
  </script>
</body>
</html>
