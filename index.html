<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>RoadPulse — Road Surface Monitor</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
    }

    body, html, #map {
      width: 100%;
      height: 100%;
      background-color: #f2f2f7;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }

    
    .ios-card {
      position: absolute;
      top: 16px;
      left: 14px;
      right: 14px;
      max-width: 390px;
      margin: 0 auto;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(0, 0, 0, 0.08);
      border-radius: 20px;
      padding: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      z-index: 1000;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .title {
      font-size: 15px;
      font-weight: 700;
      color: #1c1c1e;
      letter-spacing: -0.2px;
    }

    .badge {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 12px;
      background: #e5e5ea;
      color: #3a3a3c;
    }

    .badge.active {
      background: #e1f5fe;
      color: #0288d1;
    }

    .badge.recording {
      background: #ffebee;
      color: #d32f2f;
    }

    
    .btn-action {
      width: 100%;
      margin-top: 12px;
      padding: 12px;
      font-size: 14px;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      background: #007aff;
      color: #ffffff;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn-action:active {
      opacity: 0.7;
    }

    .btn-action.stop {
      background: #ff3b30;
    }

    /* Telemetry Info Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-top: 12px;
    }

    .stat-box {
      background: #f2f2f7;
      border-radius: 10px;
      padding: 8px 4px;
      text-align: center;
    }

    .stat-label {
      font-size: 10px;
      font-weight: 600;
      color: #8e8e93;
      text-transform: uppercase;
    }

    .stat-val {
      font-size: 12px;
      font-weight: 700;
      color: #1c1c1e;
      margin-top: 2px;
    }

    .status-text {
      margin-top: 10px;
      font-size: 12px;
      color: #3a3a3c;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .legend-bar {
      display: flex;
      justify-content: space-around;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #e5e5ea;
      font-size: 11px;
      color: #636366;
    }

    .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 4px;
    }

    .dot.red { background: #ff3b30; }
    .dot.orange { background: #ff9500; }
    .dot.yellow { background: #ffcc00; }
  </style>
</head>
<body>

  <div class="ios-card">
    <div class="card-header">
      <div class="title">RoadPulse Telemetry</div>
      <span id="ui-badge" class="badge">VIEWER</span>
    </div>

    <button id="ui-btn" class="btn-action" onclick="toggleLogger()">
      Start Telemetry Logging
    </button>

    <div class="stats-grid">
      <div class="stat-box">
        <div class="stat-label">Lat</div>
        <div id="stat-lat" class="stat-val">--.----</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Lng</div>
        <div id="stat-lng" class="stat-val">--.----</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Spots</div>
        <div id="stat-spots" class="stat-val">0</div>
      </div>
    </div>

    <div id="ui-status" class="status-text">Public map active. Tap circle for data.</div>

    <div class="legend-bar">
      <span><span class="dot red"></span>Severe</span>
      <span><span class="dot orange"></span>Moderate</span>
      <span><span class="dot yellow"></span>Minor</span>
    </div>
  </div>

  <div id="map"></div>

  <!-- Leaflet & PapaParse -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxovS5SKTpxjeOnrPMhGAGIfKIqji3a4TSxt7Sf7KrI-f7Aueh3tEPk6GcuOUwV9R-T/exec";
    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSvD2getclUw9lsCQXftP9oH4vFP8Yx9cEJe91JDXxq5p0Pz05WTGUFogtAbs5fpaW8Yj8gdIMOCrk4/pub?output=csv";
    const BLYNK_TOKEN = "k53JqlD8pCz-0Z_ixoqYMSyMgkMVN-pw";

    // 1. Initialize Map directly centered on Pune
    const map = L.map('map', { zoomControl: false }).setView([18.4883, 73.9449], 14);
    L.control.zoom({ position: 'bottomright' }).addTo(map);

    // Reliable worldwide standard OpenStreetMap tiles
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    const layerGroup = L.layerGroup().addTo(map);

    let isLogging = false;
    let myLat = null;
    let myLng = null;
    let lastBlynkPayload = "";
    let watchId = null;
    let blynkPollTimer = null;
    let mapInitialFocus = false;

    // --- CONTROLS ---
    function toggleLogger() {
      if (!isLogging) {
        startLogger();
      } else {
        stopLogger();
      }
    }

    function startLogger() {
      isLogging = true;
      document.getElementById("ui-btn").innerText = "Stop Logging";
      document.getElementById("ui-btn").classList.add("stop");
      document.getElementById("ui-badge").className = "badge active";
      document.getElementById("ui-badge").innerText = "TRACKING";
      document.getElementById("ui-status").innerText = "GPS active. Polling Blynk...";

      if (navigator.geolocation) {
        watchId = navigator.geolocation.watchPosition(
          (pos) => {
            myLat = pos.coords.latitude;
            myLng = pos.coords.longitude;
            document.getElementById("stat-lat").innerText = myLat.toFixed(4);
            document.getElementById("stat-lng").innerText = myLng.toFixed(4);
          },
          (err) => {},
          { enableHighAccuracy: true, maximumAge: 1000, timeout: 10000 }
        );
      }

      blynkPollTimer = setInterval(checkBlynk, 1100);
    }

    function stopLogger() {
      isLogging = false;
      if (blynkPollTimer) clearInterval(blynkPollTimer);
      if (watchId !== null) navigator.geolocation.clearWatch(watchId);

      document.getElementById("ui-btn").innerText = "Start Telemetry Logging";
      document.getElementById("ui-btn").classList.remove("stop");
      document.getElementById("ui-badge").className = "badge";
      document.getElementById("ui-badge").innerText = "VIEWER";
      document.getElementById("ui-status").innerText = "Session stopped.";
      document.getElementById("stat-lat").innerText = "--.----";
      document.getElementById("stat-lng").innerText = "--.----";
    }

    // --- BLYNK HARVESTER ---
    async function checkBlynk() {
      if (!isLogging) return;

      const urls = [
        `https://blr1.blynk.cloud/external/api/get?token=${BLYNK_TOKEN}&v1`,
        `https://blynk.cloud/external/api/get?token=${BLYNK_TOKEN}&v1`
      ];

      let raw = null;
      for (const url of urls) {
        try {
          const res = await fetch(url);
          if (res.ok) {
            raw = await res.text();
            if (raw && raw.trim() !== "") break;
          }
        } catch (e) {}
      }

      if (!raw || raw.trim() === "") return;

      // Clean quotes
      raw = raw.replace(/^"|"$/g, '').trim();
      if (raw === lastBlynkPayload) return;
      lastBlynkPayload = raw;

      const parts = raw.split(",");
      if (parts.length < 3) return;

      const anomalyType = parts[0].trim();
      const severity = parts[1].trim();
      const gforce = parseFloat(parts[2]) || 0;

      const targetLat = (myLat !== null) ? myLat : 18.4883;
      const targetLng = (myLng !== null) ? myLng : 73.9449;

      document.getElementById("ui-badge").className = "badge recording";
      document.getElementById("ui-badge").innerText = "RECORDING";
      document.getElementById("ui-status").innerText = `Logging: ${anomalyType} (${gforce.toFixed(2)}g)`;

      try {
        await fetch(GOOGLE_SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            type: anomalyType,
            color: severity,
            gforce: gforce,
            lat: targetLat,
            lng: targetLng
          })
        });

        setTimeout(() => {
          if (isLogging) {
            document.getElementById("ui-badge").className = "badge active";
            document.getElementById("ui-badge").innerText = "TRACKING";
            document.getElementById("ui-status").innerText = `Uploaded: ${anomalyType} to Sheet`;
            loadSheetData();
          }
        }, 1800);
      } catch (err) {
        if (isLogging) document.getElementById("ui-status").innerText = "Sheet POST error";
      }
    }

    // --- CSV PARSER & MAP MARKER RENDERER ---
    function getColor(s) {
      const val = (s || "").toUpperCase().trim();
      if (val === "RED") return "#ff3b30";
      if (val === "ORANGE") return "#ff9500";
      return "#ffcc00";
    }

    function loadSheetData() {
      const queryUrl = CSV_URL + '&nocache=' + new Date().getTime();

      Papa.parse(queryUrl, {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: function(res) {
          const rows = res.data;
          if (!rows || rows.length === 0) {
            document.getElementById("stat-spots").innerText = "0";
            return;
          }

          const clusters = {};
          const bounds = [];

          rows.forEach(r => {
            const keys = Object.keys(r);
            const latKey = keys.find(k => /lat/i.test(k));
            const lngKey = keys.find(k => /(lon|lng)/i.test(k));
            const gKey = keys.find(k => /(g_force|gforce|force)/i.test(k));
            const sevKey = keys.find(k => /(severity|color)/i.test(k));
            const typeKey = keys.find(k => /type/i.test(k));

            let lat = latKey ? parseFloat(r[latKey]) : NaN;
            let lng = lngKey ? parseFloat(r[lngKey]) : NaN;

            if (isNaN(lat) || isNaN(lng) || lat === 0 || lng === 0) return;
            if (lat < -90 || lat > 90 || lng < -180 || lng > 180) return;

            const gridKey = lat.toFixed(4) + "_" + lng.toFixed(4);

            if (!clusters[gridKey]) {
              clusters[gridKey] = {
                lat: lat,
                lng: lng,
                count: 0,
                maxG: 0,
                severity: (sevKey && r[sevKey]) ? r[sevKey] : "YELLOW",
                type: (typeKey && r[typeKey]) ? r[typeKey] : "POTHOLE"
              };
            }

            clusters[gridKey].count += 1;
            const force = gKey ? (parseFloat(r[gKey]) || 0) : 0;
            if (force > clusters[gridKey].maxG) {
              clusters[gridKey].maxG = force;
              if (sevKey && r[sevKey]) clusters[gridKey].severity = r[sevKey];
              if (typeKey && r[typeKey]) clusters[gridKey].type = r[typeKey];
            }

            bounds.push([lat, lng]);
          });

          layerGroup.clearLayers();

          Object.values(clusters).forEach(item => {
            const cColor = getColor(item.severity);
            const radius = Math.min(10 + (item.count * 2), 24);

            const circle = L.circle([item.lat, item.lng], {
              radius: radius,
              color: cColor,
              weight: 2,
              fillColor: cColor,
              fillOpacity: 0.55
            });

            circle.bindPopup(`
              <div style="font-size:13px; line-height:1.5;">
                <b style="font-size:14px;">${item.type}</b><br/>
                Reports: ${item.count}<br/>
                Max Force: ${item.maxG.toFixed(2)} g<br/>
                Severity: <b style="color:${cColor}">${item.severity}</b>
              </div>
            `);

            circle.addTo(layerGroup);
          });

          // Zoom to points only on first load
          if (!mapInitialFocus && bounds.length > 0) {
            map.fitBounds(bounds, { padding: [50, 50], maxZoom: 16 });
            mapInitialFocus = true;
          }

          document.getElementById("stat-spots").innerText = Object.keys(clusters).length;
        }
      });
    }

    // Load initial map pins immediately
    loadSheetData();
    setInterval(loadSheetData, 5000);
  </script>
</body>
</html>
