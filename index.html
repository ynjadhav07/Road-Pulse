<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>RoadPulse — Road Surface Monitor</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --bg-canvas: #f2f2f7;
      --card-bg: rgba(255, 255, 255, 0.88);
      --card-border: rgba(0, 0, 0, 0.08);
      --card-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      --text-primary: #1c1c1e;
      --text-secondary: #8e8e93;
      --stat-box-bg: #f2f2f7;
      --border-separator: #e5e5ea;
      --badge-bg: #e5e5ea;
      --badge-color: #3a3a3c;
      --status-color: #3a3a3c;
      --btn-primary: #007aff;
      --btn-text: #ffffff;
      --popup-bg: rgba(255, 255, 255, 0.95);
      --popup-text: #1c1c1e;
    }

    [data-theme="dark"] {
      --bg-canvas: #000000;
      --card-bg: rgba(28, 28, 30, 0.82);
      --card-border: rgba(255, 255, 255, 0.12);
      --card-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
      --text-primary: #f5f5f7;
      --text-secondary: #98989d;
      --stat-box-bg: rgba(255, 255, 255, 0.07);
      --border-separator: rgba(255, 255, 255, 0.1);
      --badge-bg: rgba(255, 255, 255, 0.12);
      --badge-color: #d1d1d6;
      --status-color: #aeaeb2;
      --btn-primary: #0a84ff;
      --btn-text: #ffffff;
      --popup-bg: rgba(30, 30, 32, 0.94);
      --popup-text: #f5f5f7;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
    }

    body, html, #map {
      width: 100%;
      height: 100%;
      background-color: var(--bg-canvas);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      transition: background-color 0.3s ease;
    }

    .ios-card {
      position: absolute;
      top: 16px;
      left: 14px;
      right: 14px;
      max-width: 390px;
      margin: 0 auto;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 16px;
      box-shadow: var(--card-shadow);
      z-index: 1000;
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      transition: background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.2px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .theme-toggle-btn {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 1px solid var(--card-border);
      background: var(--stat-box-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
      outline: none;
      transition: transform 0.2s ease, background 0.3s ease;
    }

    .theme-toggle-btn:active {
      transform: scale(0.90);
    }

    .theme-toggle-btn svg {
      width: 14px;
      height: 14px;
      fill: none;
      stroke: var(--text-primary);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .badge {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 12px;
      background: var(--badge-bg);
      color: var(--badge-color);
      transition: all 0.3s ease;
    }

    .badge.active {
      background: rgba(10, 132, 255, 0.2);
      color: #0a84ff;
    }

    .badge.recording {
      background: rgba(255, 69, 58, 0.2);
      color: #ff453a;
    }

    .btn-action {
      width: 100%;
      margin-top: 12px;
      padding: 12px;
      font-size: 14px;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      background: var(--btn-primary);
      color: var(--btn-text);
      cursor: pointer;
      transition: opacity 0.2s, background-color 0.2s;
    }

    .btn-action:active {
      opacity: 0.75;
    }

    .btn-action.stop {
      background: #ff3b30;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-top: 12px;
    }

    .stat-box {
      background: var(--stat-box-bg);
      border-radius: 10px;
      padding: 8px 4px;
      text-align: center;
      transition: background 0.3s ease;
    }

    .stat-label {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
    }

    .stat-val {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-primary);
      margin-top: 2px;
    }

    .status-text {
      margin-top: 10px;
      font-size: 12px;
      color: var(--status-color);
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .legend-bar {
      display: flex;
      justify-content: space-around;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--border-separator);
      font-size: 11px;
      color: var(--text-secondary);
    }

    .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 4px;
    }

    .dot.red { background: #ff3b30; }
    .dot.orange { background: #ff9500; }
    .dot.yellow { background: #ffcc00; }

    .leaflet-popup-content-wrapper {
      border-radius: 14px !important;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25) !important;
      font-family: -apple-system, sans-serif !important;
      padding: 2px !important;
      background: var(--popup-bg) !important;
      color: var(--popup-text) !important;
      border: 1px solid var(--card-border);
    }

    .leaflet-popup-tip {
      background: var(--popup-bg) !important;
    }
  </style>
</head>
<body>

  <div class="ios-card">
    <div class="card-header">
      <div class="title">RoadPulse Telemetry</div>
      <div class="header-actions">
        <button id="theme-btn" class="theme-toggle-btn" onclick="toggleTheme()" aria-label="Toggle Theme">
          <svg id="theme-icon-moon" viewBox="0 0 24 24">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
          <svg id="theme-icon-sun" viewBox="0 0 24 24" style="display:none;">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
        </button>
        <span id="ui-badge" class="badge">VIEWER</span>
      </div>
    </div>

    <button id="ui-btn" class="btn-action" onclick="toggleLogger()">
      Start Telemetry Logging
    </button>

    <div class="stats-grid">
      <div class="stat-box">
        <div class="stat-label">Lat</div>
        <div id="stat-lat" class="stat-val">--.----</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Lng</div>
        <div id="stat-lng" class="stat-val">--.----</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Spots</div>
        <div id="stat-spots" class="stat-val">0</div>
      </div>
    </div>

    <div id="ui-status" class="status-text">Public map active. Tap circle for data.</div>

    <div class="legend-bar">
      <span><span class="dot red"></span>Severe</span>
      <span><span class="dot orange"></span>Moderate</span>
      <span><span class="dot yellow"></span>Minor</span>
    </div>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxovS5SKTpxjeOnrPMhGAGIfKIqji3a4TSxt7Sf7KrI-f7Aueh3tEPk6GcuOUwV9R-T/exec";
    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSvD2getclUw9lsCQXftP9oH4vFP8Yx9cEJe91JDXxq5p0Pz05WTGUFogtAbs5fpaW8Yj8gdIMOCrk4/pub?output=csv";
    const BLYNK_TOKEN = "k53JqlD8pCz-0Z_ixoqYMSyMgkMVN-pw";

    const LIGHT_TILES = "https://tile.openstreetmap.org/{z}/{x}/{y}.png";
    const DARK_TILES = "https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png";

    let currentTheme = localStorage.getItem("roadpulse_theme") || "light";
    document.documentElement.setAttribute("data-theme", currentTheme);

    const map = L.map('map', { zoomControl: false }).setView([18.35, 73.90], 11);
    L.control.zoom({ position: 'bottomright' }).addTo(map);

    let baseTileLayer = L.tileLayer(currentTheme === "dark" ? DARK_TILES : LIGHT_TILES, {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    const layerGroup = L.layerGroup().addTo(map);

    let isLogging = false;
    let myLat = null;
    let myLng = null;
    let lastBlynkPayload = "";
    let watchId = null;
    let blynkPollTimer = null;
    let mapInitialFocus = false;

    function applyThemeUI(theme) {
      const moon = document.getElementById("theme-icon-moon");
      const sun = document.getElementById("theme-icon-sun");
      if (theme === "dark") {
        moon.style.display = "none";
        sun.style.display = "block";
      } else {
        moon.style.display = "block";
        sun.style.display = "none";
      }
    }

    function toggleTheme() {
      currentTheme = currentTheme === "light" ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", currentTheme);
      localStorage.setItem("roadpulse_theme", currentTheme);
      applyThemeUI(currentTheme);

      map.removeLayer(baseTileLayer);
      baseTileLayer = L.tileLayer(currentTheme === "dark" ? DARK_TILES : LIGHT_TILES, {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap'
      }).addTo(map);

      loadSheetData();
    }

    applyThemeUI(currentTheme);

    function toggleLogger() {
      if (!isLogging) {
        startLogger();
      } else {
        stopLogger();
      }
    }

    function startLogger() {
      isLogging = true;
      document.getElementById("ui-btn").innerText = "Stop Logging";
      document.getElementById("ui-btn").classList.add("stop");
      document.getElementById("ui-badge").className = "badge active";
      document.getElementById("ui-badge").innerText = "TRACKING";
      document.getElementById("ui-status").innerText = "GPS active. Polling Blynk...";

      if (navigator.geolocation) {
        watchId = navigator.geolocation.watchPosition(
          (pos) => {
            myLat = pos.coords.latitude;
            myLng = pos.coords.longitude;
            document.getElementById("stat-lat").innerText = myLat.toFixed(4);
            document.getElementById("stat-lng").innerText = myLng.toFixed(4);
          },
          (err) => {},
          { enableHighAccuracy: true, maximumAge: 1000, timeout: 10000 }
        );
      }

      blynkPollTimer = setInterval(checkBlynk, 1100);
    }

    function stopLogger() {
      isLogging = false;
      if (blynkPollTimer) clearInterval(blynkPollTimer);
      if (watchId !== null) navigator.geolocation.clearWatch(watchId);

      document.getElementById("ui-btn").innerText = "Start Telemetry Logging";
      document.getElementById("ui-btn").classList.remove("stop");
      document.getElementById("ui-badge").className = "badge";
      document.getElementById("ui-badge").innerText = "VIEWER";
      document.getElementById("ui-status").innerText = "Session stopped.";
      document.getElementById("stat-lat").innerText = "--.----";
      document.getElementById("stat-lng").innerText = "--.----";
    }

    async function checkBlynk() {
      if (!isLogging) return;

      const urls = [
        `https://blr1.blynk.cloud/external/api/get?token=${BLYNK_TOKEN}&v1`,
        `https://blynk.cloud/external/api/get?token=${BLYNK_TOKEN}&v1`
      ];

      let raw = null;
      for (const url of urls) {
        try {
          const res = await fetch(url);
          if (res.ok) {
            raw = await res.text();
            if (raw && raw.trim() !== "") break;
          }
        } catch (e) {}
      }

      if (!raw || raw.trim() === "") return;

      raw = raw.replace(/^"|"$/g, '').trim();
      if (raw === lastBlynkPayload) return;
      lastBlynkPayload = raw;

      const parts = raw.split(",");
      if (parts.length < 3) return;

      const anomalyType = parts[0].trim();
      const severity = parts[1].trim();
      const gforce = parseFloat(parts[2]) || 0;

      const targetLat = (myLat !== null) ? myLat : 18.4883;
      const targetLng = (myLng !== null) ? myLng : 73.9449;

      document.getElementById("ui-badge").className = "badge recording";
      document.getElementById("ui-badge").innerText = "RECORDING";
      document.getElementById("ui-status").innerText = `Logging: ${anomalyType} (${gforce.toFixed(2)}g)`;

      try {
        await fetch(GOOGLE_SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            type: anomalyType,
            color: severity,
            gforce: gforce,
            lat: targetLat,
            lng: targetLng
          })
        });

        setTimeout(() => {
          if (isLogging) {
            document.getElementById("ui-badge").className = "badge active";
            document.getElementById("ui-badge").innerText = "TRACKING";
            document.getElementById("ui-status").innerText = `Uploaded: ${anomalyType} to Sheet`;
            loadSheetData();
          }
        }, 1800);
      } catch (err) {
        if (isLogging) document.getElementById("ui-status").innerText = "Sheet POST error";
      }
    }

    function getColor(s) {
      const val = (s || "").toUpperCase().trim();
      if (val === "RED") return currentTheme === "dark" ? "#ff453a" : "#ff3b30";
      if (val === "ORANGE") return currentTheme === "dark" ? "#ff9f0a" : "#ff9500";
      return currentTheme === "dark" ? "#ffd60a" : "#ffcc00";
    }

    function loadSheetData() {
      const queryUrl = CSV_URL + '&nocache=' + new Date().getTime();

      Papa.parse(queryUrl, {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: function(res) {
          const rows = res.data;
          if (!rows || rows.length === 0) {
            document.getElementById("stat-spots").innerText = "0";
            return;
          }

          const clusters = {};
          const validPoints = [];

          rows.forEach(r => {
            const keys = Object.keys(r);
            const latKey = keys.find(k => /^(lat|latitude)/i.test(k.trim()));
            const lngKey = keys.find(k => /^(lon|lng|longitude)/i.test(k.trim()));
            const gKey = keys.find(k => /(g_force|gforce|force)/i.test(k.trim()));
            const sevKey = keys.find(k => /(severity|color)/i.test(k.trim()));
            const typeKey = keys.find(k => /type/i.test(k.trim()));

            let rawVal1 = latKey ? parseFloat(r[latKey]) : NaN;
            let rawVal2 = lngKey ? parseFloat(r[lngKey]) : NaN;

            if (isNaN(rawVal1) || isNaN(rawVal2) || rawVal1 === 0 || rawVal2 === 0) return;

            let actualLat, actualLng;
            if (rawVal1 > 50.0 && rawVal2 < 30.0) {
              actualLat = rawVal2;
              actualLng = rawVal1;
            } else {
              actualLat = rawVal1;
              actualLng = rawVal2;
            }

            if (actualLat < 8.0 || actualLat > 37.0 || actualLng < 68.0 || actualLng > 98.0) return;

            const gridKey = actualLat.toFixed(4) + "_" + actualLng.toFixed(4);

            if (!clusters[gridKey]) {
              clusters[gridKey] = {
                lat: actualLat,
                lng: actualLng,
                count: 0,
                maxG: 0,
                severity: (sevKey && r[sevKey]) ? r[sevKey] : "YELLOW",
                type: (typeKey && r[typeKey]) ? r[typeKey] : "POTHOLE"
              };
            }

            clusters[gridKey].count += 1;
            const force = gKey ? (parseFloat(r[gKey]) || 0) : 0;
            if (force > clusters[gridKey].maxG) {
              clusters[gridKey].maxG = force;
              if (sevKey && r[sevKey]) clusters[gridKey].severity = r[sevKey];
              if (typeKey && r[typeKey]) clusters[gridKey].type = r[typeKey];
            }

            validPoints.push([actualLat, actualLng]);
          });

          layerGroup.clearLayers();

          Object.values(clusters).forEach(item => {
            const cColor = getColor(item.severity);

            const circle = L.circleMarker([item.lat, item.lng], {
              radius: Math.min(5 + item.count, 12),
              color: cColor,
              weight: currentTheme === "dark" ? 2 : 1.5,
              fillColor: cColor,
              fillOpacity: currentTheme === "dark" ? 0.9 : 0.8
            });

            circle.bindPopup(`
              <div style="font-size:13px; line-height:1.5;">
                <b style="font-size:14px;">${item.type}</b><br/>
                Reports: ${item.count}<br/>
                Max Force: ${item.maxG.toFixed(2)} g<br/>
                Severity: <b style="color:${cColor}">${item.severity}</b>
              </div>
            `);

            circle.addTo(layerGroup);
          });

          if (!mapInitialFocus && validPoints.length > 0) {
            map.fitBounds(validPoints, { padding: [50, 50], maxZoom: 15 });
            mapInitialFocus = true;
          }

          document.getElementById("stat-spots").innerText = Object.keys(clusters).length;
        }
      });
    }

    loadSheetData();
    setInterval(loadSheetData, 5000);
  </script>
</body>
</html>
