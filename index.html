<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>RoadPulse Telemetry — Discrete Defect Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --bg-canvas: #0c0c0e;
      --card-bg: rgba(24, 24, 28, 0.82);
      --card-border: rgba(255, 255, 255, 0.12);
      --card-shadow: 0 14px 40px rgba(0, 0, 0, 0.65);
      --text-primary: #f5f5f7;
      --text-secondary: #98989f;
      --stat-box-bg: rgba(255, 255, 255, 0.06);
      --badge-bg: rgba(255, 255, 255, 0.12);
      --badge-color: #d1d1d6;
      --btn-primary: #0a84ff;
      --btn-text: #ffffff;
      --severe-color: #ff453a;
      --moderate-color: #ff9f0a;
      --minor-color: #ffd60a;
    }

    [data-theme="dark"] .leaflet-tile-pane {
      filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
    }

    body, html, #map {
      width: 100%;
      height: 100%;
      background-color: var(--bg-canvas);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }

    /* Move Leaflet controls out of the bottom bar's way */
    .leaflet-top.leaflet-right {
      top: 14px;
      right: 12px;
    }
    .leaflet-bar {
      border: 1px solid var(--card-border) !important;
      border-radius: 12px !important;
      overflow: hidden;
      box-shadow: var(--card-shadow) !important;
    }
    .leaflet-bar a {
      background: var(--card-bg) !important;
      color: var(--text-primary) !important;
      border-bottom: 1px solid var(--card-border) !important;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    /* Compact Top Island */
    .top-island {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 60px; /* Leaves room for zoom buttons on the right */
      max-width: 380px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 22px;
      box-shadow: var(--card-shadow);
      z-index: 1000;
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      overflow: hidden;
      transition: all 0.28s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .island-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      cursor: pointer;
    }

    .island-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #30d158;
      box-shadow: 0 0 8px #30d158;
    }
    .status-dot.tracking {
      background: #0a84ff;
      box-shadow: 0 0 8px #0a84ff;
    }
    .status-dot.recording {
      background: #ff453a;
      box-shadow: 0 0 10px #ff453a;
    }

    .island-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.2px;
    }

    .island-count {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-secondary);
      background: var(--stat-box-bg);
      padding: 2px 7px;
      border-radius: 8px;
    }

    .island-btn {
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
      border: none;
      border-radius: 14px;
      background: var(--btn-primary);
      color: var(--btn-text);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .island-btn.stop {
      background: #ff3b30;
    }

    /* Expandable Filter Tray */
    .island-tray {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.25s ease, padding 0.25s ease;
      padding: 0 10px;
    }

    .top-island.expanded .island-tray {
      max-height: 70px;
      padding: 4px 10px 10px 10px;
    }

    .filter-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 8px;
    }

    .filter-pill {
      background: var(--stat-box-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 4px 0;
      text-align: center;
      cursor: pointer;
      color: var(--text-secondary);
      font-size: 10px;
      font-weight: 600;
      transition: all 0.15s ease;
    }
    .filter-pill .num {
      font-size: 12px;
      font-weight: 700;
      display: block;
      color: var(--text-primary);
    }
    .filter-pill.active {
      background: rgba(255, 255, 255, 0.18);
      border-color: rgba(255, 255, 255, 0.4);
    }
    .filter-pill.f-red.active { border-color: var(--severe-color); background: rgba(255, 69, 58, 0.2); }
    .filter-pill.f-orange.active { border-color: var(--moderate-color); background: rgba(255, 159, 10, 0.2); }
    .filter-pill.f-yellow.active { border-color: var(--minor-color); background: rgba(255, 214, 10, 0.2); }

    /* Modern Floating Bottom Inspector Card */
    .inspector-card {
      position: absolute;
      bottom: 24px;
      left: 14px;
      right: 14px;
      max-width: 390px;
      margin: 0 auto;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 14px 16px;
      box-shadow: var(--card-shadow);
      z-index: 1000;
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      display: none;
      transform: translateY(12px);
      opacity: 0;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .inspector-card.visible {
      display: block;
      transform: translateY(0);
      opacity: 1;
    }

    .ins-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .ins-heading {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 14px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .ins-tag {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .close-btn {
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--stat-box-bg);
      border: 1px solid var(--card-border);
      border-radius: 50%;
      color: var(--text-secondary);
      font-size: 14px;
      cursor: pointer;
    }

    .ins-metrics {
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      gap: 8px;
    }

    .metric-card {
      background: var(--stat-box-bg);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      padding: 8px 10px;
    }

    .metric-label {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .metric-value {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-primary);
      margin-top: 2px;
      display: flex;
      align-items: baseline;
      gap: 3px;
    }
    .metric-value span {
      font-size: 11px;
      color: var(--text-secondary);
      font-weight: 500;
    }
  </style>
</head>
<body>

  <audio id="bg-audio-engine" loop preload="auto">
    <source src="data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA" type="audio/wav">
  </audio>

  <!-- Compact Dynamic Island Header -->
  <div id="top-island" class="top-island">
    <div class="island-header" onclick="toggleIslandExpand()">
      <div class="island-left">
        <div id="status-dot" class="status-dot"></div>
        <div class="island-title">RoadPulse</div>
        <div class="island-count" id="count-all">0</div>
      </div>
      <button id="ui-btn" class="island-btn" onclick="event.stopPropagation(); toggleLogger();">
        Start
      </button>
    </div>

    <!-- Collapsible Tray -->
    <div class="island-tray">
      <div class="filter-grid">
        <div class="filter-pill active" id="filter-all" onclick="applyFilter('ALL')">
          <span>All</span>
          <span class="num" id="tray-all">0</span>
        </div>
        <div class="filter-pill f-red" id="filter-red" onclick="applyFilter('RED')">
          <span style="color:var(--severe-color);">Severe</span>
          <span class="num" id="count-red">0</span>
        </div>
        <div class="filter-pill f-orange" id="filter-orange" onclick="applyFilter('ORANGE')">
          <span style="color:var(--moderate-color);">Mod</span>
          <span class="num" id="count-orange">0</span>
        </div>
        <div class="filter-pill f-yellow" id="filter-yellow" onclick="applyFilter('YELLOW')">
          <span style="color:var(--minor-color);">Minor</span>
          <span class="num" id="count-yellow">0</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Modern Floating Inspector Card -->
  <div id="inspector-card" class="inspector-card">
    <div class="ins-top">
      <div class="ins-heading">
        <span id="ins-dot" style="width: 8px; height: 8px; border-radius: 50%;"></span>
        <span id="ins-type">Surface Hazard</span>
        <span id="ins-badge" class="ins-tag">--</span>
      </div>
      <button class="close-btn" onclick="closeInspector()">&times;</button>
    </div>
    <div class="ins-metrics">
      <div class="metric-card">
        <div class="metric-label">Peak G-Force</div>
        <div class="metric-value" id="ins-force">-- <span>G</span></div>
      </div>
      <div class="metric-card">
        <div class="metric-label">Detected Time</div>
        <div class="metric-value" id="ins-time" style="font-size: 13px;">--</div>
      </div>
    </div>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxovS5SKTpxjeOnrPMhGAGIfKIqji3a4TSxt7Sf7KrI-f7Aueh3tEPk6GcuOUwV9R-T/exec";
    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSvD2getclUw9lsCQXftP9oH4vFP8Yx9cEJe91JDXxq5p0Pz05WTGUFogtAbs5fpaW8Yj8gdIMOCrk4/pub?output=csv";
    const BLYNK_TOKEN = "k53JqlD8pCz-0Z_ixoqYMSyMgkMVN-pw";

    const map = L.map('map', { zoomControl: false, preferCanvas: true }).setView([18.50, 73.88], 14);
    L.control.zoom({ position: 'topright' }).addTo(map);

    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    const canvasLayer = L.layerGroup().addTo(map);

    let isLogging = false;
    let myLat = null;
    let myLng = null;
    let lastBlynkPayload = "";
    let watchId = null;
    let blynkPollTimer = null;
    let mapInitialFocus = false;
    let wakeLock = null;

    let allTelemetryPoints = [];
    let currentFilter = "ALL";
    const snappedCache = new Map();

    const audioEngine = document.getElementById("bg-audio-engine");

    function toggleIslandExpand() {
      document.getElementById("top-island").classList.toggle("expanded");
    }

    function applyFilter(sev) {
      currentFilter = sev;
      document.querySelectorAll(".filter-pill").forEach(c => c.classList.remove("active"));
      document.getElementById("filter-" + sev.toLowerCase()).classList.add("active");
      renderCanvasMarkers();
    }

    function formatFriendlyTime(raw) {
      if (!raw) return "Just now";
      const parts = raw.split(" ");
      if (parts.length >= 2) {
        return parts[1].substring(0, 5); // Returns HH:MM
      }
      return raw;
    }

    function openInspector(data) {
      const panel = document.getElementById("inspector-card");
      const isRed = data.severity === "RED";
      const isOrange = data.severity === "ORANGE";
      const tagColor = isRed ? "#ff453a" : isOrange ? "#ff9f0a" : "#ffd60a";

      document.getElementById("ins-dot").style.backgroundColor = tagColor;
      document.getElementById("ins-type").innerText = data.type;
      
      const badge = document.getElementById("ins-badge");
      badge.innerText = data.severity;
      badge.style.backgroundColor = isRed ? "rgba(255,69,58,0.2)" : isOrange ? "rgba(255,159,10,0.2)" : "rgba(255,214,10,0.2)";
      badge.style.color = tagColor;

      document.getElementById("ins-force").innerHTML = `${data.gforce.toFixed(2)} <span>G</span>`;
      document.getElementById("ins-time").innerText = formatFriendlyTime(data.time);

      panel.classList.add("visible");
    }

    function closeInspector() {
      document.getElementById("inspector-card").classList.remove("visible");
    }

    async function snapPointToRoad(lat, lng) {
      const cacheKey = `${lat.toFixed(4)}_${lng.toFixed(4)}`;
      if (snappedCache.has(cacheKey)) {
        return snappedCache.get(cacheKey);
      }

      try {
        const res = await fetch(`https://router.project-osrm.org/nearest/v1/driving/${lng},${lat}?number=1`);
        if (res.ok) {
          const data = await res.json();
          if (data.waypoints && data.waypoints.length > 0) {
            const match = data.waypoints[0];
            if (match.distance <= 35) {
              const snapped = { lat: match.location[1], lng: match.location[0] };
              snappedCache.set(cacheKey, snapped);
              return snapped;
            }
          }
        }
      } catch (err) {}

      const original = { lat, lng };
      snappedCache.set(cacheKey, original);
      return original;
    }

    function renderCanvasMarkers() {
      canvasLayer.clearLayers();
      if (!allTelemetryPoints || allTelemetryPoints.length === 0) return;

      const zoom = map.getZoom();

      allTelemetryPoints.forEach(pt => {
        if (currentFilter !== "ALL" && pt.severity !== currentFilter) return;

        const isRed = pt.severity === "RED";
        const isOrange = pt.severity === "ORANGE";

        const strokeColor = isRed ? "#ff453a" : isOrange ? "#ff9f0a" : "#ffd60a";
        const ringRadius = isRed ? (zoom >= 16 ? 8 : 6) : isOrange ? (zoom >= 16 ? 6 : 4.5) : (zoom >= 16 ? 4 : 2.5);
        const strokeWeight = isRed ? 2.5 : isOrange ? 1.8 : 1.2;

        const posLat = pt.snappedLat || pt.lat;
        const posLng = pt.snappedLng || pt.lng;

        const reticle = L.circleMarker([posLat, posLng], {
          radius: ringRadius,
          color: strokeColor,
          weight: strokeWeight,
          fillColor: isRed ? strokeColor : "transparent",
          fillOpacity: isRed ? 0.35 : 0.05
        });

        reticle.on('click', () => {
          openInspector(pt);
          map.panTo([posLat, posLng], { animate: true });
        });

        reticle.addTo(canvasLayer);
      });
    }

    map.on('zoomend', renderCanvasMarkers);
    map.on('click', (e) => {
      if (e.originalEvent && !e.originalEvent.target.classList.contains('leaflet-interactive')) {
        closeInspector();
      }
    });

    async function loadSheetData() {
      const queryUrl = CSV_URL + '&nocache=' + new Date().getTime();

      Papa.parse(queryUrl, {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: async function(res) {
          const rows = res.data;
          if (!rows || rows.length === 0) return;

          const points = [];
          let cRed = 0, cOrange = 0, cYellow = 0;

          rows.forEach(r => {
            const keys = Object.keys(r);
            const latKey = keys.find(k => /^(lat|latitude)/i.test(k.trim()));
            const lngKey = keys.find(k => /^(lon|lng|longitude)/i.test(k.trim()));
            const gKey = keys.find(k => /(g_force|gforce|force)/i.test(k.trim()));
            const sevKey = keys.find(k => /(severity|color)/i.test(k.trim()));
            const typeKey = keys.find(k => /type/i.test(k.trim()));
            const timeKey = keys.find(k => /(time|timestamp|date)/i.test(k.trim()));

            let r1 = latKey ? parseFloat(r[latKey]) : NaN;
            let r2 = lngKey ? parseFloat(r[lngKey]) : NaN;
            if (isNaN(r1) || isNaN(r2) || r1 === 0 || r2 === 0) return;

            let lat = r1 > 50.0 && r2 < 30.0 ? r2 : r1;
            let lng = r1 > 50.0 && r2 < 30.0 ? r1 : r2;
            if (lat < 8.0 || lat > 37.0 || lng < 68.0 || lng > 98.0) return;

            const force = gKey ? (parseFloat(r[gKey]) || 0) : 0;
            const sev = (sevKey && r[sevKey]) ? r[sevKey].toUpperCase().trim() : "YELLOW";
            const typ = (typeKey && r[typeKey]) ? r[typeKey] : "POTHOLE";
            const tme = (timeKey && r[timeKey]) ? r[timeKey] : "";

            if (sev === "RED" || force >= 2.6) cRed++;
            else if (sev === "ORANGE" || force >= 2.0) cOrange++;
            else cYellow++;

            points.push({ lat, lng, gforce: force, severity: sev, type: typ, time: tme });
          });

          allTelemetryPoints = points;
          document.getElementById("count-all").innerText = points.length;
          document.getElementById("tray-all").innerText = points.length;
          document.getElementById("count-red").innerText = cRed;
          document.getElementById("count-orange").innerText = cOrange;
          document.getElementById("count-yellow").innerText = cYellow;

          renderCanvasMarkers();

          const uniqueClusters = new Map();
          points.forEach(p => {
            const key = `${p.lat.toFixed(4)}_${p.lng.toFixed(4)}`;
            if (!uniqueClusters.has(key)) uniqueClusters.set(key, { lat: p.lat, lng: p.lng });
          });

          for (const [key, loc] of uniqueClusters.entries()) {
            const snapped = await snapPointToRoad(loc.lat, loc.lng);
            points.forEach(p => {
              if (`${p.lat.toFixed(4)}_${p.lng.toFixed(4)}` === key) {
                p.snappedLat = snapped.lat;
                p.snappedLng = snapped.lng;
              }
            });
          }

          renderCanvasMarkers();

          if (!mapInitialFocus && points.length > 0) {
            const bounds = points.map(p => [p.snappedLat || p.lat, p.snappedLng || p.lng]);
            map.fitBounds(bounds, { padding: [50, 50], maxZoom: 16 });
            mapInitialFocus = true;
          }
        }
      });
    }

    async function toggleLogger() {
      const dot = document.getElementById("status-dot");
      const btn = document.getElementById("ui-btn");

      if (!isLogging) {
        isLogging = true;
        btn.innerText = "Stop";
        btn.classList.add("stop");
        dot.className = "status-dot tracking";

        try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
        try { audioEngine.play().catch(() => {}); } catch (e) {}

        if (navigator.geolocation) {
          watchId = navigator.geolocation.watchPosition(
            (pos) => {
              if (pos.coords.accuracy <= 20) {
                myLat = pos.coords.latitude;
                myLng = pos.coords.longitude;
              }
            },
            () => {},
            { enableHighAccuracy: true, maximumAge: 0, timeout: 15000 }
          );
        }
        blynkPollTimer = setInterval(checkBlynk, 1100);
      } else {
        isLogging = false;
        if (blynkPollTimer) clearInterval(blynkPollTimer);
        if (watchId !== null) navigator.geolocation.clearWatch(watchId);
        if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
        try { audioEngine.pause(); audioEngine.currentTime = 0; } catch (e) {}

        btn.innerText = "Start";
        btn.classList.remove("stop");
        dot.className = "status-dot";
      }
    }

    async function checkBlynk() {
      if (!isLogging || myLat === null || myLng === null) return;

      const url = `https://blr1.blynk.cloud/external/api/get?token=${BLYNK_TOKEN}&v1`;
      try {
        const res = await fetch(url);
        if (!res.ok) return;
        let raw = await res.text();
        raw = raw.replace(/^"|"$/g, '').trim();
        if (!raw || raw === lastBlynkPayload) return;
        lastBlynkPayload = raw;

        const parts = raw.split(",");
        if (parts.length < 3) return;

        const dot = document.getElementById("status-dot");
        dot.className = "status-dot recording";

        await fetch(GOOGLE_SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            type: parts[0].trim(),
            color: parts[1].trim(),
            gforce: parseFloat(parts[2]) || 0,
            lat: myLat,
            lng: myLng
          })
        });

        setTimeout(() => {
          if (isLogging) dot.className = "status-dot tracking";
          loadSheetData();
        }, 1800);
      } catch (e) {}
    }

    loadSheetData();
    setInterval(loadSheetData, 5000);
  </script>
</body>
</html>
