<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>RoadPulse - Real-Time Road Quality Telemetry</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    html, body, #map {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: #0f172a;
    }

    .telemetry-dashboard {
      position: absolute;
      top: 14px;
      left: 14px;
      right: 14px;
      max-width: 420px;
      margin: 0 auto;
      background: rgba(15, 23, 42, 0.94);
      color: #f8fafc;
      padding: 16px;
      border-radius: 12px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
      z-index: 1000;
      border: 1px solid #334155;
      backdrop-filter: blur(12px);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .telemetry-dashboard.collapsed {
      padding: 8px 16px;
      width: fit-content;
      cursor: pointer;
      opacity: 0.92;
      background: rgba(15, 23, 42, 0.88);
    }

    .telemetry-dashboard.collapsed .collapsible-node {
      display: none !important;
    }

    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-title {
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #f1f5f9;
    }

    .status-indicator {
      font-size: 10px;
      padding: 3px 8px;
      border-radius: 9999px;
      font-weight: 700;
      letter-spacing: 0.05em;
      background: #475569;
      color: #ffffff;
      text-transform: uppercase;
    }

    .status-indicator.active {
      background: #16a34a;
      color: #ffffff;
    }

    .status-indicator.recording {
      background: #dc2626;
      color: #ffffff;
      animation: pulse-ring 1.2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

    @keyframes pulse-ring {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.65; }
    }

    .action-button {
      width: 100%;
      padding: 11px;
      font-size: 13px;
      border-radius: 6px;
      border: none;
      background: #22c55e;
      color: #0f172a;
      font-weight: 700;
      cursor: pointer;
      margin-top: 12px;
      letter-spacing: 0.025em;
      transition: background-color 0.2s;
    }

    .action-button.terminating {
      background: #ef4444;
      color: #ffffff;
    }

    .metrics-container {
      display: flex;
      justify-content: space-between;
      margin-top: 12px;
      font-size: 11px;
      color: #94a3b8;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    .metrics-container span b {
      color: #38bdf8;
      font-weight: 600;
    }

    .log-terminal {
      margin-top: 10px;
      font-size: 11px;
      color: #38bdf8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    .classification-legend {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid #334155;
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #cbd5e1;
    }

    .marker-dot {
      height: 8px;
      width: 8px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 5px;
    }

    .marker-dot.danger { background: #ef4444; }
    .marker-dot.warning { background: #f97316; }
    .marker-dot.moderate { background: #eab308; }
  </style>
</head>
<body>

  <audio id="playback-keepalive" loop playsinline style="display:none;">
    <source src="https://raw.githubusercontent.com/anars/blank-audio/master/10-minutes-of-silence.mp3" type="audio/mp3">
  </audio>

  <div id="telemetry-panel" class="telemetry-dashboard" onclick="maximizePanel()">
    <div class="header-row">
      <div class="brand-title">RoadPulse Telemetry System</div>
      <span id="system-status" class="status-indicator">STANDBY</span>
    </div>

    <button id="operation-toggle" class="action-button collapsible-node" onclick="event.stopPropagation(); toggleTelemetrySession()">
      INITIALIZE TELEMETRY LOGGER
    </button>

    <div class="metrics-container collapsible-node">
      <span>LAT: <b id="latitude-metric">--.----</b></span>
      <span>LNG: <b id="longitude-metric">--.----</b></span>
      <span>ANOMALIES: <b id="cluster-metric">0 Detected</b></span>
    </div>

    <div id="status-terminal" class="log-terminal collapsible-node">Telemetry receiver idle.</div>

    <div class="classification-legend collapsible-node">
      <span><span class="marker-dot danger"></span>Severe</span>
      <span><span class="marker-dot warning"></span>Moderate</span>
      <span><span class="marker-dot moderate"></span>Minor</span>
      <span style="color:#64748b;">Spatial Clustering</span>
    </div>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <script>
    const GOOGLE_APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxovS5SKTpxjeOnrPMhGAGIfKIqji3a4TSxt7Sf7KrI-f7Aueh3tEPk6GcuOUwV9R-T/exec";
    const DATABASE_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSvD2getclUw9lsCQXftP9oH4vFP8Yx9cEJe91JDXxq5p0Pz05WTGUFogtAbs5fpaW8Yj8gdIMOCrk4/pub?output=csv";
    const BLYNK_TOKEN = "k53JqlD8pCz-0Z_ixoqYMSyMgkMVN-pw";

    const REGIONAL_CLUSTERS = [
      "https://blr1.blynk.cloud",
      "https://blynk.cloud",
      "https://ny3.blynk.cloud"
    ];

    const map = L.map('map', { zoomControl: false }).setView([18.4883, 73.9449], 13);
    L.control.zoom({ position: 'bottomright' }).addTo(map);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);

    const vectorLayer = L.layerGroup().addTo(map);
    let viewBoundsInitialized = false;

    let isSessionActive = false;
    let currentLatitude = null;
    let currentLongitude = null;
    let previousTelemetryHash = "";
    let displayWakeLock = null;
    let panelCollapseTimeout = null;
    let geolocationWatchIdentifier = null;
    let pollingIntervalIdentifier = null;

    function maximizePanel() {
      const panel = document.getElementById("telemetry-panel");
      if (panel.classList.contains("collapsed")) {
        panel.classList.remove("collapsed");
        if (isSessionActive) {
          queuePanelCollapse(6000);
        }
      }
    }

    function minimizePanel() {
      if (isSessionActive) {
        document.getElementById("telemetry-panel").classList.add("collapsed");
      }
    }

    function queuePanelCollapse(duration = 4000) {
      clearTimeout(panelCollapseTimeout);
      panelCollapseTimeout = setTimeout(minimizePanel, duration);
    }

    function setSystemState(isProcessing, message) {
      const statusElement = document.getElementById("system-status");
      const panelElement = document.getElementById("telemetry-panel");
      const terminalElement = document.getElementById("status-terminal");

      terminalElement.innerText = message;

      if (isProcessing) {
        statusElement.className = "status-indicator recording";
        statusElement.innerText = "RECORDING";
        panelElement.classList.remove("collapsed");
        clearTimeout(panelCollapseTimeout);
      } else {
        statusElement.className = "status-indicator active";
        statusElement.innerText = "MONITORING";
        queuePanelCollapse(3000);
      }
    }

    async function retainSystemExecution() {
      try {
        const audioNode = document.getElementById("playback-keepalive");
        await audioNode.play();
      } catch (exception) {}

      if ('wakeLock' in navigator) {
        try {
          displayWakeLock = await navigator.wakeLock.request('screen');
        } catch (exception) {}
      }
    }

    function releaseSystemExecution() {
      try {
        const audioNode = document.getElementById("playback-keepalive");
        audioNode.pause();
        audioNode.currentTime = 0;
      } catch (exception) {}

      if (displayWakeLock !== null) {
        displayWakeLock.release().then(() => {
          displayWakeLock = null;
        }).catch(() => {});
      }
    }

    function toggleTelemetrySession() {
      if (!isSessionActive) {
        startTelemetrySession();
      } else {
        terminateTelemetrySession();
      }
    }

    function startTelemetrySession() {
      isSessionActive = true;

      const toggleButton = document.getElementById("operation-toggle");
      const statusElement = document.getElementById("system-status");
      
      toggleButton.innerText = "TERMINATE LOGGING SESSION";
      toggleButton.classList.add("terminating");
      statusElement.className = "status-indicator active";
      statusElement.innerText = "MONITORING";

      retainSystemExecution();

      if (!navigator.geolocation) {
        setSystemState(false, "Hardware interface failure: Geolocation unavailable");
        return;
      }

      geolocationWatchIdentifier = navigator.geolocation.watchPosition(
        (position) => {
          currentLatitude = position.coords.latitude;
          currentLongitude = position.coords.longitude;
          document.getElementById("latitude-metric").innerText = currentLatitude.toFixed(4);
          document.getElementById("longitude-metric").innerText = currentLongitude.toFixed(4);
        },
        (error) => {
          document.getElementById("status-terminal").innerText = `Coordinate acquisition failure: ${error.message}`;
        },
        { enableHighAccuracy: true, maximumAge: 1000, timeout: 10000 }
      );

      pollingIntervalIdentifier = setInterval(synchronizeTelemetryFeed, 1000);
      setSystemState(false, "Telemetry receiver synchronized. Awaiting event.");
      queuePanelCollapse(4000);
    }

    function terminateTelemetrySession() {
      isSessionActive = false;

      if (pollingIntervalIdentifier) clearInterval(pollingIntervalIdentifier);
      if (geolocationWatchIdentifier !== null) navigator.geolocation.clearWatch(geolocationWatchIdentifier);
      
      releaseSystemExecution();
      clearTimeout(panelCollapseTimeout);

      const toggleButton = document.getElementById("operation-toggle");
      const statusElement = document.getElementById("system-status");
      const panelElement = document.getElementById("telemetry-panel");

      toggleButton.innerText = "INITIALIZE TELEMETRY LOGGER";
      toggleButton.classList.remove("terminating");
      statusElement.className = "status-indicator";
      statusElement.innerText = "STANDBY";
      panelElement.classList.remove("collapsed");

      document.getElementById("latitude-metric").innerText = "--.----";
      document.getElementById("longitude-metric").innerText = "--.----";
      document.getElementById("status-terminal").innerText = "Session terminated. Viewer mode active.";
    }

    async function synchronizeTelemetryFeed() {
      if (!isSessionActive) return;

      let inboundPayload = null;

      for (const endpoint of REGIONAL_CLUSTERS) {
        try {
          const response = await fetch(`${endpoint}/external/api/get?token=${BLYNK_TOKEN}&v1`);
          if (response.ok) {
            const rawContent = await response.text();
            if (rawContent && rawContent.trim() !== "") {
              inboundPayload = rawContent;
              break;
            }
          }
        } catch (networkError) {}
      }

      if (!inboundPayload || inboundPayload.trim() === "") {
        return;
      }

      const sanitizedPayload = inboundPayload.replace(/^"|"$/g, '').trim();

      if (sanitizedPayload === previousTelemetryHash) {
        return;
      }

      previousTelemetryHash = sanitizedPayload;

      const telemetrySegments = sanitizedPayload.split(",");
      if (telemetrySegments.length < 3) {
        return;
      }

      const anomalyType = telemetrySegments[0].trim();
      const anomalySeverity = telemetrySegments[1].trim();
      const measuredForce = parseFloat(telemetrySegments[2]) || 0;

      const submissionLatitude = (currentLatitude !== null) ? currentLatitude : 18.4883;
      const submissionLongitude = (currentLongitude !== null) ? currentLongitude : 73.9449;

      setSystemState(true, `Pushing telemetry: ${anomalyType} (${measuredForce.toFixed(2)}g)`);

      const networkTransmissionPackage = {
        type: anomalyType,
        color: anomalySeverity,
        gforce: measuredForce,
        lat: submissionLatitude,
        lng: submissionLongitude
      };

      try {
        await fetch(GOOGLE_APPS_SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(networkTransmissionPackage)
        });

        setTimeout(() => {
          if (isSessionActive) {
            setSystemState(false, `Recorded: ${anomalyType} at [${submissionLatitude.toFixed(4)}, ${submissionLongitude.toFixed(4)}]`);
            fetchGlobalSpatialDataset();
          }
        }, 2000);

      } catch (transmissionError) {
        if (isSessionActive) {
          setSystemState(false, `Transmission failure: ${transmissionError.message}`);
        }
      }
    }

    function getSeverityRGB(severityString) {
      const normalized = (severityString || "").toUpperCase().trim();
      if (normalized === "RED") return "239, 68, 68";
      if (normalized === "ORANGE") return "249, 115, 22";
      return "234, 179, 8";
    }

    function fetchGlobalSpatialDataset() {
      const datasetQueryUri = DATABASE_CSV_URL + '&nocache=' + new Date().getTime();

      Papa.parse(datasetQueryUri, {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: function(parsingResults) {
          const tabularData = parsingResults.data;
          if (!tabularData || tabularData.length === 0) {
            document.getElementById("cluster-metric").innerText = "0 Detected";
            return;
          }

          vectorLayer.clearLayers();
          const spatialClusters = {};
          const structuralBounds = [];

          tabularData.forEach(entry => {
            const latitude = parseFloat(entry.Latitude);
            const longitude = parseFloat(entry.Longitude);

            if (!isNaN(latitude) && !isNaN(longitude) && latitude !== 0 && longitude !== 0) {
              const spatialKey = latitude.toFixed(4) + "_" + longitude.toFixed(4);
              if (!spatialClusters[spatialKey]) {
                spatialClusters[spatialKey] = {
                  lat: latitude,
                  lng: longitude,
                  incidentCount: 0,
                  peakForce: 0,
                  severityGrade: entry.Severity || "YELLOW",
                  classification: entry.Type || "POTHOLE"
                };
              }

              spatialClusters[spatialKey].incidentCount += 1;
              const observedForce = parseFloat(entry.G_Force) || 0;
              if (observedForce > spatialClusters[spatialKey].peakForce) {
                spatialClusters[spatialKey].peakForce = observedForce;
                spatialClusters[spatialKey].severityGrade = entry.Severity || "YELLOW";
                spatialClusters[spatialKey].classification = entry.Type || "POTHOLE";
              }
            }
          });

          Object.values(spatialClusters).forEach(feature => {
            const rgbColorSignature = getSeverityRGB(feature.severityGrade);
            const dynamicRadiusMeters = 8 + (feature.incidentCount - 1) * 4;
            const dynamicOpacity = Math.min(0.35 + (feature.incidentCount * 0.08), 0.85);

            const anomalyCircle = L.circle([feature.lat, feature.lng], {
              radius: dynamicRadiusMeters,
              color: `rgba(${rgbColorSignature}, 0.9)`,
              weight: 1.5,
              fillColor: `rgba(${rgbColorSignature}, ${dynamicOpacity})`,
              fillOpacity: dynamicOpacity
            });

            anomalyCircle.bindPopup(`
              <div style="font-size:12px; line-height:1.6; color:#0f172a;">
                <b style="font-size:13px;">${feature.classification}</b><br/>
                <b>Total Logged Incidents:</b> ${feature.incidentCount}<br/>
                <b>Peak Dynamic Impact:</b> ${feature.peakForce.toFixed(2)} g<br/>
                <b>Severity Classification:</b> <span style="font-weight:700; color:rgb(${rgbColorSignature})">${feature.severityGrade}</span>
              </div>
            `);

            anomalyCircle.addTo(vectorLayer);
            structuralBounds.push([feature.lat, feature.lng]);
          });

          if (!viewBoundsInitialized && structuralBounds.length > 0) {
            map.fitBounds(structuralBounds, { padding: [60, 60] });
            viewBoundsInitialized = true;
          }

          document.getElementById("cluster-metric").innerText = `${Object.keys(spatialClusters).length} Detected`;
        }
      });
    }

    fetchGlobalSpatialDataset();
    setInterval(fetchGlobalSpatialDataset, 5000);
  </script>
</body>
</html>
