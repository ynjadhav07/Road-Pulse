<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>RoadPulse — Road Surface Monitor</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <style>
    :root {
      --bg-canvas: #121214;
      --card-bg: rgba(28, 28, 30, 0.85);
      --card-border: rgba(255, 255, 255, 0.12);
      --card-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
      --text-primary: #f5f5f7;
      --text-secondary: #98989d;
      --stat-box-bg: rgba(255, 255, 255, 0.08);
      --border-separator: rgba(255, 255, 255, 0.1);
      --badge-bg: rgba(255, 255, 255, 0.12);
      --badge-color: #d1d1d6;
      --status-color: #aeaeb2;
      --btn-primary: #0a84ff;
      --btn-text: #ffffff;
      --popup-bg: rgba(30, 30, 32, 0.95);
      --popup-text: #f5f5f7;
    }

    [data-theme="light"] {
      --bg-canvas: #f2f2f7;
      --card-bg: rgba(255, 255, 255, 0.88);
      --card-border: rgba(0, 0, 0, 0.08);
      --card-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      --text-primary: #1c1c1e;
      --text-secondary: #8e8e93;
      --stat-box-bg: #f2f2f7;
      --border-separator: #e5e5ea;
      --badge-bg: #e5e5ea;
      --badge-color: #3a3a3c;
      --status-color: #3a3a3c;
      --btn-primary: #007aff;
      --btn-text: #ffffff;
      --popup-bg: rgba(255, 255, 255, 0.95);
      --popup-text: #1c1c1e;
    }

    [data-theme="dark"] .leaflet-tile-pane {
      filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
    }

    body, html, #map {
      width: 100%;
      height: 100%;
      background-color: var(--bg-canvas);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }

    .ios-card {
      position: absolute;
      top: 16px;
      left: 14px;
      right: 14px;
      max-width: 400px;
      margin: 0 auto;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 16px;
      box-shadow: var(--card-shadow);
      z-index: 1000;
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .theme-toggle-btn {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 1px solid var(--card-border);
      background: var(--stat-box-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .theme-toggle-btn svg {
      width: 14px;
      height: 14px;
      fill: none;
      stroke: var(--text-primary);
      stroke-width: 2;
    }

    .badge {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 12px;
      background: var(--badge-bg);
      color: var(--badge-color);
    }

    .badge.active {
      background: rgba(10, 132, 255, 0.2);
      color: #0a84ff;
    }

    .badge.recording {
      background: rgba(255, 69, 58, 0.2);
      color: #ff453a;
    }

    .btn-action {
      width: 100%;
      margin-top: 12px;
      padding: 11px;
      font-size: 14px;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      background: var(--btn-primary);
      color: var(--btn-text);
      cursor: pointer;
    }

    .btn-action.stop {
      background: #ff3b30;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 5px;
      margin-top: 12px;
    }

    .stat-box {
      background: var(--stat-box-bg);
      border-radius: 10px;
      padding: 8px 3px;
      text-align: center;
    }

    .stat-label {
      font-size: 9px;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
    }

    .stat-val {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-primary);
      margin-top: 2px;
    }

    .filter-pills {
      display: flex;
      gap: 6px;
      margin-top: 12px;
    }

    .filter-pill {
      flex: 1;
      padding: 6px 0;
      font-size: 11px;
      font-weight: 600;
      border-radius: 8px;
      border: 1px solid var(--card-border);
      background: var(--stat-box-bg);
      color: var(--text-secondary);
      cursor: pointer;
      text-align: center;
    }

    .filter-pill.active {
      background: var(--btn-primary);
      color: #ffffff;
      border-color: transparent;
    }

    .status-text {
      margin-top: 10px;
      font-size: 12px;
      color: var(--status-color);
      text-align: center;
    }

    .leaflet-popup-content-wrapper {
      border-radius: 14px !important;
      background: var(--popup-bg) !important;
      color: var(--popup-text) !important;
      border: 1px solid var(--card-border);
    }
  </style>
</head>
<body>

  <audio id="bg-audio-engine" loop preload="auto">
    <source src="data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA" type="audio/wav">
  </audio>

  <div class="ios-card">
    <div class="card-header">
      <div class="title">RoadPulse Cluster View</div>
      <div class="header-actions">
        <button id="theme-btn" class="theme-toggle-btn" onclick="toggleTheme()" aria-label="Toggle Theme">
          <svg id="theme-icon-moon" viewBox="0 0 24 24" style="display:none;">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
          <svg id="theme-icon-sun" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
        </button>
        <span id="ui-badge" class="badge">VIEWER</span>
      </div>
    </div>

    <button id="ui-btn" class="btn-action" onclick="toggleLogger()">
      Start Telemetry Logging
    </button>

    <div class="stats-grid">
      <div class="stat-box">
        <div class="stat-label">Lat</div>
        <div id="stat-lat" class="stat-val">--.----</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Lng</div>
        <div id="stat-lng" class="stat-val">--.----</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Total</div>
        <div id="stat-spots" class="stat-val">0</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Queue</div>
        <div id="stat-queue" class="stat-val">0</div>
      </div>
    </div>

    <div class="filter-pills">
      <button class="filter-pill active" id="f-all" onclick="changeFilter('ALL')">All</button>
      <button class="filter-pill" id="f-red" onclick="changeFilter('RED')">Severe</button>
      <button class="filter-pill" id="f-orange" onclick="changeFilter('ORANGE')">Moderate</button>
      <button class="filter-pill" id="f-yellow" onclick="changeFilter('YELLOW')">Minor</button>
    </div>

    <div id="ui-status" class="status-text">No lines. Grouped by cluster for clean view.</div>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxovS5SKTpxjeOnrPMhGAGIfKIqji3a4TSxt7Sf7KrI-f7Aueh3tEPk6GcuOUwV9R-T/exec";
    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSvD2getclUw9lsCQXftP9oH4vFP8Yx9cEJe91JDXxq5p0Pz05WTGUFogtAbs5fpaW8Yj8gdIMOCrk4/pub?output=csv";
    const BLYNK_TOKEN = "k53JqlD8pCz-0Z_ixoqYMSyMgkMVN-pw";
    const QUEUE_STORAGE_KEY = "roadpulse_offline_queue";

    let currentTheme = localStorage.getItem("roadpulse_theme") || "dark";
    document.documentElement.setAttribute("data-theme", currentTheme);

    const map = L.map('map', { zoomControl: false }).setView([18.35, 73.90], 11);
    L.control.zoom({ position: 'bottomright' }).addTo(map);

    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    const markersCluster = L.markerClusterGroup({
      maxClusterRadius: 40,
      spiderfyOnMaxZoom: true,
      showCoverageOnHover: false
    });
    map.addLayer(markersCluster);

    let isLogging = false;
    let myLat = null;
    let myLng = null;
    let smoothLat = null;
    let smoothLng = null;
    let lastBlynkPayload = "";
    let watchId = null;
    let blynkPollTimer = null;
    let mapInitialFocus = false;
    let wakeLock = null;
    let activeSeverityFilter = "ALL";
    let cachedRows = [];

    const audioEngine = document.getElementById("bg-audio-engine");

    function toggleTheme() {
      currentTheme = currentTheme === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", currentTheme);
      localStorage.setItem("roadpulse_theme", currentTheme);
      document.getElementById("theme-icon-moon").style.display = currentTheme === "dark" ? "none" : "block";
      document.getElementById("theme-icon-sun").style.display = currentTheme === "dark" ? "block" : "none";
      renderMarkers();
    }

    function changeFilter(val) {
      activeSeverityFilter = val;
      document.querySelectorAll(".filter-pill").forEach(el => el.classList.remove("active"));
      document.getElementById("f-" + val.toLowerCase()).classList.add("active");
      renderMarkers();
    }

    function getColor(s) {
      if (s === "RED") return "#ff453a";
      if (s === "ORANGE") return "#ff9f0a";
      return "#ffd60a";
    }

    function renderMarkers() {
      markersCluster.clearLayers();
      if (!cachedRows || cachedRows.length === 0) return;

      const filtered = cachedRows.filter(p => {
        if (activeSeverityFilter === "ALL") return true;
        return p.severity === activeSeverityFilter;
      });

      filtered.forEach(p => {
        const c = getColor(p.severity);
        const marker = L.circleMarker([p.lat, p.lng], {
          radius: p.severity === "RED" ? 7 : p.severity === "ORANGE" ? 5 : 4,
          fillColor: c,
          color: "#ffffff",
          weight: 1,
          fillOpacity: 0.9
        }).bindPopup(`
          <div style="font-size:13px; line-height:1.4;">
            <b>${p.type}</b><br/>
            Severity: <b style="color:${c}">${p.severity}</b><br/>
            Force: ${p.gforce.toFixed(2)} g<br/>
            Time: ${p.time || "N/A"}
          </div>
        `);
        markersCluster.addLayer(marker);
      });

      document.getElementById("stat-spots").innerText = filtered.length;
    }

    function loadSheetData() {
      const queryUrl = CSV_URL + '&nocache=' + new Date().getTime();
      Papa.parse(queryUrl, {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: function(res) {
          const rows = res.data;
          if (!rows || rows.length === 0) return;

          const clean = [];
          rows.forEach(r => {
            const keys = Object.keys(r);
            const latKey = keys.find(k => /^(lat|latitude)/i.test(k.trim()));
            const lngKey = keys.find(k => /^(lon|lng|longitude)/i.test(k.trim()));
            const gKey = keys.find(k => /(g_force|gforce|force)/i.test(k.trim()));
            const sevKey = keys.find(k => /(severity|color)/i.test(k.trim()));
            const typeKey = keys.find(k => /type/i.test(k.trim()));
            const timeKey = keys.find(k => /(time|timestamp|date)/i.test(k.trim()));

            let r1 = latKey ? parseFloat(r[latKey]) : NaN;
            let r2 = lngKey ? parseFloat(r[lngKey]) : NaN;
            if (isNaN(r1) || isNaN(r2) || r1 === 0 || r2 === 0) return;

            let lat = r1 > 50.0 && r2 < 30.0 ? r2 : r1;
            let lng = r1 > 50.0 && r2 < 30.0 ? r1 : r2;

            if (lat < 8.0 || lat > 37.0 || lng < 68.0 || lng > 98.0) return;

            clean.push({
              lat: lat,
              lng: lng,
              gforce: gKey ? (parseFloat(r[gKey]) || 0) : 0,
              severity: sevKey ? r[sevKey] : "YELLOW",
              type: typeKey ? r[typeKey] : "POTHOLE",
              time: timeKey ? r[timeKey] : ""
            });
          });

          cachedRows = clean;
          renderMarkers();

          if (!mapInitialFocus && clean.length > 0) {
            const bounds = clean.map(p => [p.lat, p.lng]);
            map.fitBounds(bounds, { padding: [50, 50], maxZoom: 15 });
            mapInitialFocus = true;
          }
        }
      });
    }

    loadSheetData();
    setInterval(loadSheetData, 5000);
  </script>
</body>
</html>
