<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>RoadPulse Telemetry — Discrete Defect Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --bg-canvas: #111113;
      --card-bg: rgba(26, 26, 28, 0.90);
      --card-border: rgba(255, 255, 255, 0.12);
      --card-shadow: 0 16px 36px rgba(0, 0, 0, 0.6);
      --text-primary: #f5f5f7;
      --text-secondary: #98989d;
      --stat-box-bg: rgba(255, 255, 255, 0.06);
      --border-separator: rgba(255, 255, 255, 0.1);
      --badge-bg: rgba(255, 255, 255, 0.12);
      --badge-color: #d1d1d6;
      --btn-primary: #0a84ff;
      --btn-text: #ffffff;
      --popup-bg: rgba(28, 28, 30, 0.95);
      --popup-text: #f5f5f7;
    }

    [data-theme="dark"] .leaflet-tile-pane {
      filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
    }

    body, html, #map {
      width: 100%;
      height: 100%;
      background-color: var(--bg-canvas);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }

    /* Top Floating Dashboard */
    .top-dashboard {
      position: absolute;
      top: 14px;
      left: 12px;
      right: 12px;
      max-width: 410px;
      margin: 0 auto;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 14px 16px;
      box-shadow: var(--card-shadow);
      z-index: 1000;
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
    }

    .dash-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-title {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.2px;
      color: var(--text-primary);
    }

    .badge {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 10px;
      background: var(--badge-bg);
      color: var(--badge-color);
    }

    .badge.active {
      background: rgba(10, 132, 255, 0.25);
      color: #0a84ff;
    }

    .badge.recording {
      background: rgba(255, 69, 58, 0.25);
      color: #ff453a;
    }

    /* Interactive Severity Pills */
    .filter-strip {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 5px;
      margin-top: 12px;
    }

    .filter-chip {
      padding: 7px 2px;
      border-radius: 10px;
      border: 1px solid var(--card-border);
      background: var(--stat-box-bg);
      color: var(--text-secondary);
      font-size: 11px;
      font-weight: 600;
      text-align: center;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      transition: all 0.2s ease;
    }

    .filter-chip .chip-count {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .filter-chip.active {
      background: rgba(255, 255, 255, 0.16);
      border-color: rgba(255, 255, 255, 0.4);
      color: var(--text-primary);
    }

    .filter-chip.chip-red.active {
      background: rgba(255, 69, 58, 0.22);
      border-color: #ff453a;
    }
    .filter-chip.chip-orange.active {
      background: rgba(255, 159, 10, 0.22);
      border-color: #ff9f0a;
    }
    .filter-chip.chip-yellow.active {
      background: rgba(255, 214, 10, 0.22);
      border-color: #ffd60a;
    }

    /* Logger Trigger Button */
    .btn-logger {
      width: 100%;
      margin-top: 10px;
      padding: 9px;
      font-size: 13px;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      background: var(--btn-primary);
      color: var(--btn-text);
      cursor: pointer;
    }

    .btn-logger.stop {
      background: #ff3b30;
    }

    /* Bottom Inspector Drawer */
    .inspector-panel {
      position: absolute;
      bottom: 18px;
      left: 12px;
      right: 12px;
      max-width: 410px;
      margin: 0 auto;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 12px 16px;
      box-shadow: var(--card-shadow);
      z-index: 1000;
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      display: none;
      animation: slide-up 0.25s ease-out;
    }

    @keyframes slide-up {
      from { transform: translateY(16px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .inspector-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .inspector-title {
      font-size: 14px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .close-inspector {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      font-size: 18px;
      cursor: pointer;
      padding: 0 4px;
    }

    .inspector-metrics {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-top: 6px;
    }

    .metric-item {
      background: var(--stat-box-bg);
      border-radius: 8px;
      padding: 6px;
      text-align: center;
    }

    .metric-item .m-label {
      font-size: 9px;
      color: var(--text-secondary);
      text-transform: uppercase;
      font-weight: 600;
    }

    .metric-item .m-val {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-primary);
      margin-top: 2px;
    }
  </style>
</head>
<body>

  <audio id="bg-audio-engine" loop preload="auto">
    <source src="data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA" type="audio/wav">
  </audio>

  <!-- Top Dashboard Controls -->
  <div class="top-dashboard">
    <div class="dash-header">
      <div class="brand-title">RoadPulse Inspector</div>
      <span id="ui-badge" class="badge">VIEWER</span>
    </div>

    <!-- Severity Filter Tabs -->
    <div class="filter-strip">
      <button class="filter-chip active" id="filter-all" onclick="applyFilter('ALL')">
        <span>All</span>
        <span class="chip-count" id="count-all">0</span>
      </button>
      <button class="filter-chip chip-red" id="filter-red" onclick="applyFilter('RED')">
        <span style="color:#ff453a;">Severe</span>
        <span class="chip-count" id="count-red">0</span>
      </button>
      <button class="filter-chip chip-orange" id="filter-orange" onclick="applyFilter('ORANGE')">
        <span style="color:#ff9f0a;">Moderate</span>
        <span class="chip-count" id="count-orange">0</span>
      </button>
      <button class="filter-chip chip-yellow" id="filter-yellow" onclick="applyFilter('YELLOW')">
        <span style="color:#ffd60a;">Minor</span>
        <span class="chip-count" id="count-yellow">0</span>
      </button>
    </div>

    <button id="ui-btn" class="btn-logger" onclick="toggleLogger()">
      Start Telemetry Logging
    </button>
  </div>

  <!-- Bottom Interactive Telemetry Inspector -->
  <div id="inspector" class="inspector-panel">
    <div class="inspector-header">
      <div class="inspector-title" id="ins-type">Pothole Alert</div>
      <button class="close-inspector" onclick="closeInspector()">&times;</button>
    </div>
    <div class="inspector-metrics">
      <div class="metric-item">
        <div class="m-label">Impact</div>
        <div class="m-val" id="ins-force">--</div>
      </div>
      <div class="metric-item">
        <div class="m-label">Severity</div>
        <div class="m-val" id="ins-severity">--</div>
      </div>
      <div class="metric-item">
        <div class="m-label">Time</div>
        <div class="m-val" id="ins-time" style="font-size:11px;">--</div>
      </div>
    </div>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxovS5SKTpxjeOnrPMhGAGIfKIqji3a4TSxt7Sf7KrI-f7Aueh3tEPk6GcuOUwV9R-T/exec";
    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSvD2getclUw9lsCQXftP9oH4vFP8Yx9cEJe91JDXxq5p0Pz05WTGUFogtAbs5fpaW8Yj8gdIMOCrk4/pub?output=csv";
    const BLYNK_TOKEN = "k53JqlD8pCz-0Z_ixoqYMSyMgkMVN-pw";

    const map = L.map('map', { zoomControl: false, preferCanvas: true }).setView([18.50, 73.88], 12);
    L.control.zoom({ position: 'bottomright' }).addTo(map);

    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    const canvasLayer = L.layerGroup().addTo(map);

    let isLogging = false;
    let myLat = null;
    let myLng = null;
    let lastBlynkPayload = "";
    let watchId = null;
    let blynkPollTimer = null;
    let mapInitialFocus = false;
    let wakeLock = null;

    let allTelemetryPoints = [];
    let currentFilter = "ALL";

    const audioEngine = document.getElementById("bg-audio-engine");

    function applyFilter(sev) {
      currentFilter = sev;
      document.querySelectorAll(".filter-chip").forEach(c => c.classList.remove("active"));
      document.getElementById("filter-" + sev.toLowerCase()).classList.add("active");
      renderCanvasMarkers();
    }

    function closeInspector() {
      document.getElementById("inspector").style.display = "none";
    }

    function openInspector(data) {
      const panel = document.getElementById("inspector");
      const typeEl = document.getElementById("ins-type");
      const forceEl = document.getElementById("ins-force");
      const sevEl = document.getElementById("ins-severity");
      const timeEl = document.getElementById("ins-time");

      const isRed = data.severity === "RED";
      const isOrange = data.severity === "ORANGE";
      const tagColor = isRed ? "#ff453a" : isOrange ? "#ff9f0a" : "#ffd60a";

      typeEl.innerHTML = `<span style="display:inline-block; width:8px; height:8px; border-radius:50%; background:${tagColor};"></span> ${data.type}`;
      forceEl.innerText = `${data.gforce.toFixed(2)} G`;
      sevEl.innerText = data.severity;
      sevEl.style.color = tagColor;
      timeEl.innerText = data.time || "Logged";

      panel.style.display = "block";
    }

    function renderCanvasMarkers() {
      canvasLayer.clearLayers();
      if (!allTelemetryPoints || allTelemetryPoints.length === 0) return;

      const zoom = map.getZoom();

      allTelemetryPoints.forEach(pt => {
        if (currentFilter !== "ALL" && pt.severity !== currentFilter) {
          return;
        }

        const isRed = pt.severity === "RED";
        const isOrange = pt.severity === "ORANGE";

        const strokeColor = isRed ? "#ff453a" : isOrange ? "#ff9f0a" : "#ffd60a";
        const ringRadius = isRed ? (zoom >= 15 ? 8 : 6) : isOrange ? (zoom >= 15 ? 6 : 4.5) : (zoom >= 15 ? 4 : 3);
        const strokeWeight = isRed ? 2.5 : isOrange ? 1.8 : 1.2;

        // Hollow Donut Reticle (Center is clear to view underlying tarmac)
        const reticle = L.circleMarker([pt.lat, pt.lng], {
          radius: ringRadius,
          color: strokeColor,
          weight: strokeWeight,
          fillColor: isRed ? strokeColor : "transparent",
          fillOpacity: isRed ? 0.35 : 0.05
        });

        reticle.on('click', () => {
          openInspector(pt);
          map.panTo([pt.lat, pt.lng], { animate: true });
        });

        reticle.addTo(canvasLayer);
      });
    }

    map.on('zoomend', renderCanvasMarkers);
    map.on('click', (e) => {
      // Close drawer if user taps empty map area
      if (e.originalEvent && !e.originalEvent.target.classList.contains('leaflet-interactive')) {
        closeInspector();
      }
    });

    function loadSheetData() {
      const queryUrl = CSV_URL + '&nocache=' + new Date().getTime();

      Papa.parse(queryUrl, {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: function(res) {
          const rows = res.data;
          if (!rows || rows.length === 0) return;

          const points = [];
          let cRed = 0;
          let cOrange = 0;
          let cYellow = 0;

          rows.forEach(r => {
            const keys = Object.keys(r);
            const latKey = keys.find(k => /^(lat|latitude)/i.test(k.trim()));
            const lngKey = keys.find(k => /^(lon|lng|longitude)/i.test(k.trim()));
            const gKey = keys.find(k => /(g_force|gforce|force)/i.test(k.trim()));
            const sevKey = keys.find(k => /(severity|color)/i.test(k.trim()));
            const typeKey = keys.find(k => /type/i.test(k.trim()));
            const timeKey = keys.find(k => /(time|timestamp|date)/i.test(k.trim()));

            let r1 = latKey ? parseFloat(r[latKey]) : NaN;
            let r2 = lngKey ? parseFloat(r[lngKey]) : NaN;
            if (isNaN(r1) || isNaN(r2) || r1 === 0 || r2 === 0) return;

            let lat = r1 > 50.0 && r2 < 30.0 ? r2 : r1;
            let lng = r1 > 50.0 && r2 < 30.0 ? r1 : r2;
            if (lat < 8.0 || lat > 37.0 || lng < 68.0 || lng > 98.0) return;

            const force = gKey ? (parseFloat(r[gKey]) || 0) : 0;
            const sev = (sevKey && r[sevKey]) ? r[sevKey].toUpperCase().trim() : "YELLOW";
            const typ = (typeKey && r[typeKey]) ? r[typeKey] : "POTHOLE";
            const tme = (timeKey && r[timeKey]) ? r[timeKey] : "";

            if (sev === "RED" || force >= 2.6) cRed++;
            else if (sev === "ORANGE" || force >= 2.0) cOrange++;
            else cYellow++;

            points.push({
              lat,
              lng,
              gforce: force,
              severity: sev,
              type: typ,
              time: tme
            });
          });

          allTelemetryPoints = points;

          document.getElementById("count-all").innerText = points.length;
          document.getElementById("count-red").innerText = cRed;
          document.getElementById("count-orange").innerText = cOrange;
          document.getElementById("count-yellow").innerText = cYellow;

          renderCanvasMarkers();

          if (!mapInitialFocus && points.length > 0) {
            const bounds = points.map(p => [p.lat, p.lng]);
            map.fitBounds(bounds, { padding: [50, 50], maxZoom: 15 });
            mapInitialFocus = true;
          }
        }
      });
    }

    async function toggleLogger() {
      if (!isLogging) {
        isLogging = true;
        document.getElementById("ui-btn").innerText = "Stop Telemetry";
        document.getElementById("ui-btn").classList.add("stop");
        document.getElementById("ui-badge").className = "badge active";
        document.getElementById("ui-badge").innerText = "TRACKING";

        try {
          if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
        } catch (e) {}

        try { audioEngine.play().catch(() => {}); } catch (e) {}

        if (navigator.geolocation) {
          watchId = navigator.geolocation.watchPosition(
            (pos) => {
              if (pos.coords.accuracy <= 25) {
                myLat = pos.coords.latitude;
                myLng = pos.coords.longitude;
              }
            },
            () => {},
            { enableHighAccuracy: true, maximumAge: 0, timeout: 15000 }
          );
        }
        blynkPollTimer = setInterval(checkBlynk, 1100);
      } else {
        isLogging = false;
        if (blynkPollTimer) clearInterval(blynkPollTimer);
        if (watchId !== null) navigator.geolocation.clearWatch(watchId);
        if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
        try { audioEngine.pause(); audioEngine.currentTime = 0; } catch (e) {}

        document.getElementById("ui-btn").innerText = "Start Telemetry Logging";
        document.getElementById("ui-btn").classList.remove("stop");
        document.getElementById("ui-badge").className = "badge";
        document.getElementById("ui-badge").innerText = "VIEWER";
      }
    }

    async function checkBlynk() {
      if (!isLogging || myLat === null || myLng === null) return;

      const url = `https://blr1.blynk.cloud/external/api/get?token=${BLYNK_TOKEN}&v1`;
      try {
        const res = await fetch(url);
        if (!res.ok) return;
        let raw = await res.text();
        raw = raw.replace(/^"|"$/g, '').trim();
        if (!raw || raw === lastBlynkPayload) return;
        lastBlynkPayload = raw;

        const parts = raw.split(",");
        if (parts.length < 3) return;

        document.getElementById("ui-badge").className = "badge recording";
        document.getElementById("ui-badge").innerText = "RECORDING";

        await fetch(GOOGLE_SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            type: parts[0].trim(),
            color: parts[1].trim(),
            gforce: parseFloat(parts[2]) || 0,
            lat: myLat,
            lng: myLng
          })
        });

        setTimeout(() => {
          if (isLogging) {
            document.getElementById("ui-badge").className = "badge active";
            document.getElementById("ui-badge").innerText = "TRACKING";
          }
          loadSheetData();
        }, 1800);
      } catch (e) {}
    }

    loadSheetData();
    setInterval(loadSheetData, 5000);
  </script>
</body>
</html>
