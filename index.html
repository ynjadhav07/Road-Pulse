<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>RoadPulse — Road Surface Monitor</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --bg-canvas: #f2f2f7;
      --card-bg: rgba(255, 255, 255, 0.88);
      --card-border: rgba(0, 0, 0, 0.08);
      --card-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      --text-primary: #1c1c1e;
      --text-secondary: #8e8e93;
      --stat-box-bg: #f2f2f7;
      --border-separator: #e5e5ea;
      --badge-bg: #e5e5ea;
      --badge-color: #3a3a3c;
      --status-color: #3a3a3c;
      --btn-primary: #007aff;
      --btn-text: #ffffff;
      --popup-bg: rgba(255, 255, 255, 0.95);
      --popup-text: #1c1c1e;
    }

    [data-theme="dark"] {
      --bg-canvas: #121214;
      --card-bg: rgba(28, 28, 30, 0.85);
      --card-border: rgba(255, 255, 255, 0.12);
      --card-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
      --text-primary: #f5f5f7;
      --text-secondary: #98989d;
      --stat-box-bg: rgba(255, 255, 255, 0.08);
      --border-separator: rgba(255, 255, 255, 0.1);
      --badge-bg: rgba(255, 255, 255, 0.12);
      --badge-color: #d1d1d6;
      --status-color: #aeaeb2;
      --btn-primary: #0a84ff;
      --btn-text: #ffffff;
      --popup-bg: rgba(30, 30, 32, 0.95);
      --popup-text: #f5f5f7;
    }

    [data-theme="dark"] .leaflet-tile-pane {
      filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
    }

    body, html, #map {
      width: 100%;
      height: 100%;
      background-color: var(--bg-canvas);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      transition: background-color 0.3s ease;
    }

    .ios-card {
      position: absolute;
      top: 16px;
      left: 14px;
      right: 14px;
      max-width: 390px;
      margin: 0 auto;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 16px;
      box-shadow: var(--card-shadow);
      z-index: 1000;
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      transition: background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.2px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .theme-toggle-btn {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 1px solid var(--card-border);
      background: var(--stat-box-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
      outline: none;
      transition: transform 0.2s ease, background 0.3s ease;
    }

    .theme-toggle-btn:active {
      transform: scale(0.90);
    }

    .theme-toggle-btn svg {
      width: 14px;
      height: 14px;
      fill: none;
      stroke: var(--text-primary);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .badge {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 12px;
      background: var(--badge-bg);
      color: var(--badge-color);
      transition: all 0.3s ease;
    }

    .badge.active {
      background: rgba(10, 132, 255, 0.2);
      color: #0a84ff;
    }

    .badge.recording {
      background: rgba(255, 69, 58, 0.2);
      color: #ff453a;
    }

    .badge.offline {
      background: rgba(255, 159, 10, 0.2);
      color: #ff9f0a;
    }

    .btn-action {
      width: 100%;
      margin-top: 12px;
      padding: 12px;
      font-size: 14px;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      background: var(--btn-primary);
      color: var(--btn-text);
      cursor: pointer;
      transition: opacity 0.2s, background-color 0.2s;
    }

    .btn-action:active {
      opacity: 0.75;
    }

    .btn-action.stop {
      background: #ff3b30;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 5px;
      margin-top: 12px;
    }

    .stat-box {
      background: var(--stat-box-bg);
      border-radius: 10px;
      padding: 8px 3px;
      text-align: center;
      transition: background 0.3s ease;
    }

    .stat-label {
      font-size: 9px;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
    }

    .stat-val {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-primary);
      margin-top: 2px;
    }

    .status-text {
      margin-top: 10px;
      font-size: 12px;
      color: var(--status-color);
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .legend-bar {
      display: flex;
      justify-content: space-around;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--border-separator);
      font-size: 11px;
      color: var(--text-secondary);
    }

    .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 4px;
    }

    .dot.red { background: #ff3b30; }
    .dot.orange { background: #ff9500; }
    .dot.yellow { background: #ffcc00; }

    .leaflet-popup-content-wrapper {
      border-radius: 14px !important;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25) !important;
      font-family: -apple-system, sans-serif !important;
      padding: 2px !important;
      background: var(--popup-bg) !important;
      color: var(--popup-text) !important;
      border: 1px solid var(--card-border);
    }

    .leaflet-popup-tip {
      background: var(--popup-bg) !important;
    }
  </style>
</head>
<body>

  <audio id="bg-audio-engine" loop preload="auto">
    <source src="data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA" type="audio/wav">
  </audio>

  <div class="ios-card">
    <div class="card-header">
      <div class="title">RoadPulse Telemetry</div>
      <div class="header-actions">
        <button id="theme-btn" class="theme-toggle-btn" onclick="toggleTheme()" aria-label="Toggle Theme">
          <svg id="theme-icon-moon" viewBox="0 0 24 24">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
          <svg id="theme-icon-sun" viewBox="0 0 24 24" style="display:none;">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
        </button>
        <span id="ui-badge" class="badge">VIEWER</span>
      </div>
    </div>

    <button id="ui-btn" class="btn-action" onclick="toggleLogger()">
      Start Telemetry Logging
    </button>

    <div class="stats-grid">
      <div class="stat-box">
        <div class="stat-label">Lat</div>
        <div id="stat-lat" class="stat-val">--.----</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Lng</div>
        <div id="stat-lng" class="stat-val">--.----</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Spots</div>
        <div id="stat-spots" class="stat-val">0</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Queue</div>
        <div id="stat-queue" class="stat-val">0</div>
      </div>
    </div>

    <div id="ui-status" class="status-text">Public map active. Tap circle for data.</div>

    <div class="legend-bar">
      <span><span class="dot red"></span>Severe</span>
      <span><span class="dot orange"></span>Moderate</span>
      <span><span class="dot yellow"></span>Minor</span>
    </div>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxovS5SKTpxjeOnrPMhGAGIfKIqji3a4TSxt7Sf7KrI-f7Aueh3tEPk6GcuOUwV9R-T/exec";
    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSvD2getclUw9lsCQXftP9oH4vFP8Yx9cEJe91JDXxq5p0Pz05WTGUFogtAbs5fpaW8Yj8gdIMOCrk4/pub?output=csv";
    const BLYNK_TOKEN = "k53JqlD8pCz-0Z_ixoqYMSyMgkMVN-pw";
    const QUEUE_STORAGE_KEY = "roadpulse_offline_queue";

    let currentTheme = localStorage.getItem("roadpulse_theme") || "light";
    document.documentElement.setAttribute("data-theme", currentTheme);

    const map = L.map('map', { zoomControl: false, preferCanvas: true }).setView([18.35, 73.90], 11);
    L.control.zoom({ position: 'bottomright' }).addTo(map);

    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    const layerGroup = L.layerGroup().addTo(map);

    let isLogging = false;
    let myLat = null;
    let myLng = null;
    let lastBlynkPayload = "";
    let watchId = null;
    let blynkPollTimer = null;
    let mapInitialFocus = false;
    let wakeLock = null;
    let isFlushingQueue = false;
    let cachedRawRows = [];

    const audioEngine = document.getElementById("bg-audio-engine");

    function getStoredQueue() {
      try {
        const raw = localStorage.getItem(QUEUE_STORAGE_KEY);
        return raw ? JSON.parse(raw) : [];
      } catch (e) {
        return [];
      }
    }

    function saveStoredQueue(queue) {
      localStorage.setItem(QUEUE_STORAGE_KEY, JSON.stringify(queue));
      updateQueueUI();
    }

    function updateQueueUI() {
      const q = getStoredQueue();
      const el = document.getElementById("stat-queue");
      if (el) el.innerText = q.length;
    }

    function queuePayloadLocally(payload) {
      const q = getStoredQueue();
      q.push(payload);
      saveStoredQueue(q);
      document.getElementById("ui-badge").className = "badge offline";
      document.getElementById("ui-badge").innerText = "QUEUED";
      document.getElementById("ui-status").innerText = `Offline: Buffered to device (${q.length} in queue)`;
    }

    async function flushOfflineQueue() {
      if (isFlushingQueue || !navigator.onLine) return;
      let q = getStoredQueue();
      if (q.length === 0) return;

      isFlushingQueue = true;
      document.getElementById("ui-status").innerText = `Syncing ${q.length} cached records...`;

      while (q.length > 0 && navigator.onLine) {
        const item = q[0];
        try {
          await fetch(GOOGLE_SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify(item)
          });
          q.shift();
          saveStoredQueue(q);
        } catch (err) {
          break;
        }
      }

      isFlushingQueue = false;
      updateQueueUI();
      loadSheetData();
      if (isLogging) {
        document.getElementById("ui-badge").className = "badge active";
        document.getElementById("ui-badge").innerText = "TRACKING";
      }
    }

    window.addEventListener("online", flushOfflineQueue);
    setInterval(flushOfflineQueue, 10000);

    function applyThemeUI(theme) {
      const moon = document.getElementById("theme-icon-moon");
      const sun = document.getElementById("theme-icon-sun");
      if (theme === "dark") {
        moon.style.display = "none";
        sun.style.display = "block";
      } else {
        moon.style.display = "block";
        sun.style.display = "none";
      }
    }

    function toggleTheme() {
      currentTheme = currentTheme === "light" ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", currentTheme);
      localStorage.setItem("roadpulse_theme", currentTheme);
      applyThemeUI(currentTheme);
      renderProcessedMarkers();
    }

    applyThemeUI(currentTheme);
    updateQueueUI();

    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
        }
      } catch (err) {}
    }

    function releaseWakeLock() {
      if (wakeLock !== null) {
        wakeLock.release().then(() => {
          wakeLock = null;
        }).catch(() => {});
      }
    }

    document.addEventListener("visibilitychange", async () => {
      if (isLogging && document.visibilityState === 'visible') {
        await requestWakeLock();
      }
    });

    function toggleLogger() {
      if (!isLogging) {
        startLogger();
      } else {
        stopLogger();
      }
    }

    async function startLogger() {
      isLogging = true;
      document.getElementById("ui-btn").innerText = "Stop Logging";
      document.getElementById("ui-btn").classList.add("stop");
      document.getElementById("ui-badge").className = "badge active";
      document.getElementById("ui-badge").innerText = "TRACKING";
      document.getElementById("ui-status").innerText = "Background logging locked & active";

      await requestWakeLock();

      try {
        audioEngine.play().catch(() => {});
      } catch (e) {}

      if (navigator.geolocation) {
        watchId = navigator.geolocation.watchPosition(
          (pos) => {
            myLat = pos.coords.latitude;
            myLng = pos.coords.longitude;
            document.getElementById("stat-lat").innerText = myLat.toFixed(4);
            document.getElementById("stat-lng").innerText = myLng.toFixed(4);
          },
          (err) => {
            document.getElementById("ui-status").innerText = "GPS Lock Weak/Lost";
          },
          { enableHighAccuracy: true, maximumAge: 0, timeout: 15000 }
        );
      }

      blynkPollTimer = setInterval(checkBlynk, 1100);
      flushOfflineQueue();
    }

    function stopLogger() {
      isLogging = false;
      if (blynkPollTimer) clearInterval(blynkPollTimer);
      if (watchId !== null) navigator.geolocation.clearWatch(watchId);

      releaseWakeLock();

      try {
        audioEngine.pause();
        audioEngine.currentTime = 0;
      } catch (e) {}

      document.getElementById("ui-btn").innerText = "Start Telemetry Logging";
      document.getElementById("ui-btn").classList.remove("stop");
      document.getElementById("ui-badge").className = "badge";
      document.getElementById("ui-badge").innerText = "VIEWER";
      document.getElementById("ui-status").innerText = "Session stopped.";
      document.getElementById("stat-lat").innerText = "--.----";
      document.getElementById("stat-lng").innerText = "--.----";
    }

    async function checkBlynk() {
      if (!isLogging) return;

      const urls = [
        `https://blr1.blynk.cloud/external/api/get?token=${BLYNK_TOKEN}&v1`,
        `https://blynk.cloud/external/api/get?token=${BLYNK_TOKEN}&v1`
      ];

      let raw = null;
      for (const url of urls) {
        try {
          const res = await fetch(url);
          if (res.ok) {
            raw = await res.text();
            if (raw && raw.trim() !== "") break;
          }
        } catch (e) {}
      }

      if (!raw || raw.trim() === "") return;

      raw = raw.replace(/^"|"$/g, '').trim();
      if (raw === lastBlynkPayload) return;
      lastBlynkPayload = raw;

      const parts = raw.split(",");
      if (parts.length < 3) return;

      if (myLat === null || myLng === null) {
        document.getElementById("ui-status").innerText = "Skipped: Awaiting GPS accuracy";
        return;
      }

      const anomalyType = parts[0].trim();
      const severity = parts[1].trim();
      const gforce = parseFloat(parts[2]) || 0;

      const recordPayload = {
        type: anomalyType,
        color: severity,
        gforce: gforce,
        lat: myLat,
        lng: myLng
      };

      if (!navigator.onLine) {
        queuePayloadLocally(recordPayload);
        return;
      }

      document.getElementById("ui-badge").className = "badge recording";
      document.getElementById("ui-badge").innerText = "RECORDING";
      document.getElementById("ui-status").innerText = `Logged: ${anomalyType} (${gforce.toFixed(2)}g)`;

      try {
        await fetch(GOOGLE_SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(recordPayload)
        });

        setTimeout(() => {
          if (isLogging) {
            document.getElementById("ui-badge").className = "badge active";
            document.getElementById("ui-badge").innerText = "TRACKING";
            loadSheetData();
          }
        }, 1800);
      } catch (err) {
        queuePayloadLocally(recordPayload);
      }
    }

    function getColor(s) {
      const val = (s || "").toUpperCase().trim();
      if (val === "RED") return currentTheme === "dark" ? "#ff453a" : "#ff3b30";
      if (val === "ORANGE") return currentTheme === "dark" ? "#ff9f0a" : "#ff9500";
      return currentTheme === "dark" ? "#ffd60a" : "#ffcc00";
    }

    function renderProcessedMarkers() {
      if (!cachedRawRows || cachedRawRows.length === 0) return;

      const zoom = map.getZoom();
      const precision = zoom <= 11 ? 2 : zoom <= 13 ? 3 : 4;
      const clusters = {};
      const validPoints = [];

      cachedRawRows.forEach(r => {
        const keys = Object.keys(r);
        const latKey = keys.find(k => /^(lat|latitude)/i.test(k.trim()));
        const lngKey = keys.find(k => /^(lon|lng|longitude)/i.test(k.trim()));
        const gKey = keys.find(k => /(g_force|gforce|force)/i.test(k.trim()));
        const sevKey = keys.find(k => /(severity|color)/i.test(k.trim()));
        const typeKey = keys.find(k => /type/i.test(k.trim()));

        let rawVal1 = latKey ? parseFloat(r[latKey]) : NaN;
        let rawVal2 = lngKey ? parseFloat(r[lngKey]) : NaN;

        if (isNaN(rawVal1) || isNaN(rawVal2) || rawVal1 === 0 || rawVal2 === 0) return;

        let actualLat = rawVal1 > 50.0 && rawVal2 < 30.0 ? rawVal2 : rawVal1;
        let actualLng = rawVal1 > 50.0 && rawVal2 < 30.0 ? rawVal1 : rawVal2;

        if (actualLat < 8.0 || actualLat > 37.0 || actualLng < 68.0 || actualLng > 98.0) return;

        const gridKey = actualLat.toFixed(precision) + "_" + actualLng.toFixed(precision);

        if (!clusters[gridKey]) {
          clusters[gridKey] = {
            lat: actualLat,
            lng: actualLng,
            count: 0,
            maxG: 0,
            severity: (sevKey && r[sevKey]) ? r[sevKey] : "YELLOW",
            type: (typeKey && r[typeKey]) ? r[typeKey] : "POTHOLE"
          };
        }

        clusters[gridKey].count += 1;
        const force = gKey ? (parseFloat(r[gKey]) || 0) : 0;
        if (force > clusters[gridKey].maxG) {
          clusters[gridKey].maxG = force;
          if (sevKey && r[sevKey]) clusters[gridKey].severity = r[sevKey];
          if (typeKey && r[typeKey]) clusters[gridKey].type = r[typeKey];
        }

        validPoints.push([actualLat, actualLng]);
      });

      layerGroup.clearLayers();

      Object.values(clusters).forEach(item => {
        const cColor = getColor(item.severity);
        const baseRadius = zoom <= 11 ? 4 : zoom <= 13 ? 6 : 8;
        const markerRadius = Math.min(baseRadius + Math.log2(item.count + 1) * 1.5, 16);

        const circle = L.circleMarker([item.lat, item.lng], {
          radius: markerRadius,
          color: currentTheme === "dark" ? "#ffffff" : cColor,
          weight: currentTheme === "dark" ? 1 : 0.8,
          fillColor: cColor,
          fillOpacity: zoom <= 11 ? 0.65 : 0.85
        });

        circle.bindPopup(`
          <div style="font-size:13px; line-height:1.5;">
            <b style="font-size:14px;">${item.type}</b><br/>
            Reports in Zone: ${item.count}<br/>
            Peak Force: ${item.maxG.toFixed(2)} g<br/>
            Severity: <b style="color:${cColor}">${item.severity}</b>
          </div>
        `);

        circle.addTo(layerGroup);
      });

      if (!mapInitialFocus && validPoints.length > 0) {
        map.fitBounds(validPoints, { padding: [50, 50], maxZoom: 14 });
        mapInitialFocus = true;
      }

      document.getElementById("stat-spots").innerText = Object.keys(clusters).length;
    }

    map.on('zoomend', renderProcessedMarkers);

    function loadSheetData() {
      const queryUrl = CSV_URL + '&nocache=' + new Date().getTime();

      Papa.parse(queryUrl, {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: function(res) {
          cachedRawRows = res.data || [];
          renderProcessedMarkers();
        }
      });
    }

    loadSheetData();
    setInterval(loadSheetData, 5000);
  </script>
</body>
</html>
